name: Full promotion validation

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      full_mobile:
        description: "Run Android lint and debug/release assembly"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 8 * * *"

concurrency:
  group: vinifera-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  classify:
    name: Classify full validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification_succeeded: ${{ steps.classify.outputs.classification_succeeded }}
      lane: ${{ steps.classify.outputs.lane }}
      reason: ${{ steps.classify.outputs.reason }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      mobile_required: ${{ steps.classify.outputs.mobile_required }}
      browser_required: ${{ steps.classify.outputs.browser_required }}
      database_required: ${{ steps.classify.outputs.database_required }}
      paths_json: ${{ steps.classify.outputs.paths_json }}
    steps:
      - name: Check out exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify exact base and head diff
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          FULL_MOBILE: ${{ inputs.full_mobile || false }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$EVENT_BEFORE"
            head_sha="$EVENT_SHA"
          else
            head_sha="$EVENT_SHA"
            base_sha=$(git rev-parse "${head_sha}^")
          fi

          for pair in "base:$base_sha" "head:$head_sha"; do
            label="${pair%%:*}"
            sha="${pair#*:}"
            if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$label SHA is missing or is not an exact commit SHA."
              exit 1
            fi
          done

          git fetch --no-tags --depth=1 origin "$base_sha"

          for pair in "base:$base_sha" "head:$head_sha"; do
            sha="${pair#*:}"
            git cat-file -e "${sha}^{commit}"
          done

          EVENT_NAME="$EVENT_NAME" BASE_SHA="$base_sha" HEAD_SHA="$head_sha" FULL_MOBILE="$FULL_MOBILE" \
            node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import {
            classifyDeliveryChange,
            readChangedRecords,
          } from "./.github/scripts/delivery-policy.mjs";

          let classification;
          try {
            classification = classifyDeliveryChange(readChangedRecords(
              process.env.BASE_SHA,
              process.env.HEAD_SHA,
            ));
          } catch (error) {
            classification = {
              classificationSucceeded: false,
              reason: `classifier_exception: ${error.message}`,
              paths: [],
              mobileRequired: false,
            };
          }
          const mobileRequired =
            process.env.EVENT_NAME === "schedule" ||
            process.env.FULL_MOBILE === "true" ||
            classification.mobileRequired === true;
          const stagingFastContext =
            process.env.PR_BASE_REF === "staging" ||
            process.env.EVENT_REF === "refs/heads/staging";
          const validationLane =
            classification.lane === "noop" ||
            classification.lane === "docs" ||
            classification.lane === "promotion-smoke" ||
            classification.lane === "static-routing" ||
            classification.lane === "promotion-smoke-cleanup" ||
            classification.lane === "ci-script-tested" ||
            classification.lane === "dependency-tooling-tested" ||
            classification.lane === "release-control-tested" ||
            (classification.lane === "operator-tooling-tested" && stagingFastContext)
              ? classification.lane
              : "full";
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `classification_succeeded=${classification.classificationSucceeded}`,
              `lane=${validationLane}`,
              `reason=${classification.reason.replaceAll(/[\r\n]+/g, " ")}`,
              `base_sha=${process.env.BASE_SHA}`,
              `head_sha=${process.env.HEAD_SHA}`,
              `mobile_required=${mobileRequired}`,
              `browser_required=${classification.browserRequired === true}`,
              `database_required=${classification.databaseRequired === true}`,
              `paths_json=${JSON.stringify(classification.paths)}`,
              "",
            ].join("\n"),
          );
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Full validation scope",
              "",
              `- Exact base SHA: \`${process.env.BASE_SHA}\``,
              `- Exact head SHA: \`${process.env.HEAD_SHA}\``,
              `- Classification succeeded: \`${classification.classificationSucceeded}\``,
              `- Selected lane: \`${validationLane}\``,
              `- Android required: \`${mobileRequired}\``,
              `- Browser QA required: \`${classification.browserRequired === true}\``,
              `- Database QA required: \`${classification.databaseRequired === true}\``,
              `- Changed paths: ${classification.paths.map((path) => `\`${path}\``).join(", ") || "(none)"}`,
              "",
            ].join("\n"),
          );
          NODE

  docs_validation:
    name: Documentation-only validation
    needs: classify
    if: needs.classify.outputs.classification_succeeded == 'true' && needs.classify.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact pull request base
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Use repository Node.js pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Revalidate documentation contracts
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import {
            scanDiffForSecrets,
            validateDocumentationChange,
          } from "./.github/scripts/docs-ci-policy.mjs";

          const result = validateDocumentationChange({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          scanDiffForSecrets({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          const paths = result.records.map(
            ({ status, paths }) => `${status} ${paths.join(" -> ")}`,
          );
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Documentation-only validation",
              "",
              `- Exact base SHA: \`${process.env.BASE_SHA}\``,
              `- Exact head SHA: \`${process.env.HEAD_SHA}\``,
              "- Selected lane: `docs`",
              `- Checks executed: ${[
                "npm ci",
                "git diff --check",
                ...result.checks,
                "credential-pattern scan",
              ].join(", ")}`,
              "- Result: `pass`",
              "- Revalidated paths:",
              "",
              "```text",
              ...paths,
              "```",
              "",
            ].join("\n"),
          );
          NODE

      - name: Report documentation validation failure
        if: failure()
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          {
            echo "## Documentation-only validation"
            echo
            echo "- Exact base SHA: \`$BASE_SHA\`"
            echo "- Exact head SHA: \`$HEAD_SHA\`"
            echo "- Selected lane: \`docs\`"
            echo "- Result: \`fail\`"
            echo "- Inspect the failed step above for the last check executed."
          } >> "$GITHUB_STEP_SUMMARY"

  promotion_smoke_validation:
    name: Hidden promotion smoke validation
    needs: classify
    if: needs.classify.outputs.classification_succeeded == 'true' && needs.classify.outputs.lane == 'promotion-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact pull request base
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Use repository Node.js pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate hidden artifact contract
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          PATHS_JSON: ${{ needs.classify.outputs.paths_json }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node --test .github/scripts/delivery-policy.policy.mjs
          node --input-type=module <<'NODE'
          import { scanDiffForSecrets } from "./.github/scripts/docs-ci-policy.mjs";
          scanDiffForSecrets({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          NODE

          mapfile -t artifact_paths < <(jq -r '.[]' <<<"$PATHS_JSON")
          if (( ${#artifact_paths[@]} == 0 )); then
            echo "::error::Promotion smoke lane did not include any artifacts."
            exit 1
          fi
          for artifact in "${artifact_paths[@]}"; do
            if [[ ! "$artifact" =~ ^public/vinifera-promotion-smoke-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?\.html$ ]]; then
              echo "::error::Unexpected promotion smoke artifact path: $artifact"
              exit 1
            fi
            grep -qi 'noindex' "$artifact"
            grep -qi 'nofollow' "$artifact"
          done

          npm run build:pages

          for artifact in "${artifact_paths[@]}"; do
            built="dist/${artifact#public/}"
            test -f "$built"
            artifact_name="${artifact##*/}"
            if grep -R --exclude="$artifact_name" -n "$artifact_name" dist >/tmp/promotion-smoke-links.txt; then
              echo "::error::Hidden smoke artifact is linked from the built site:"
              cat /tmp/promotion-smoke-links.txt
              exit 1
            fi
          done

          {
            echo "## Hidden promotion smoke validation"
            echo
            echo "- Exact base SHA: \`$BASE_SHA\`"
            echo "- Exact head SHA: \`$HEAD_SHA\`"
            echo "- Artifacts: \`${artifact_paths[*]}\`"
            echo "- Result: \`pass\`"
          } >> "$GITHUB_STEP_SUMMARY"

  static_routing_validation:
    name: Static routing validation
    needs: classify
    if: needs.classify.outputs.classification_succeeded == 'true' && needs.classify.outputs.lane == 'static-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact pull request base
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Use repository Node.js pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate static routing contract
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          PATHS_JSON: ${{ needs.classify.outputs.paths_json }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node --test .github/scripts/delivery-policy.policy.mjs
          node --input-type=module <<'NODE'
          import { scanDiffForSecrets } from "./.github/scripts/docs-ci-policy.mjs";
          scanDiffForSecrets({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          NODE

          mapfile -t routing_paths < <(jq -r '.[]' <<<"$PATHS_JSON")
          if ! printf '%s\n' "${routing_paths[@]}" | grep -qx 'public/_redirects'; then
            echo "::error::Static routing lane must include public/_redirects."
            exit 1
          fi
          if printf '%s\n' "${routing_paths[@]}" \
            | grep -Ev '^(CHANGELOG\.md|public/_redirects)$' \
            >/tmp/unexpected-static-routing-paths.txt; then
            echo "::error::Static routing lane only permits CHANGELOG.md and public/_redirects."
            cat /tmp/unexpected-static-routing-paths.txt
            exit 1
          fi

          git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- public/_redirects > /tmp/redirects.diff
          if grep -E '^[+-][^+-]' /tmp/redirects.diff \
            | grep -Ev '^[+-]/vinifera-promotion-smoke-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?[[:space:]]+/[[:space:]]+302$' \
            >/tmp/unexpected-redirect-lines.txt; then
            echo "::error::Static routing lane only permits exact retired promotion-smoke redirects."
            cat /tmp/unexpected-redirect-lines.txt
            exit 1
          fi
          mapfile -t routing_slugs < <(
            grep -E '^\+/vinifera-promotion-smoke-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?[[:space:]]+/[[:space:]]+302$' /tmp/redirects.diff \
              | awk '{ sub(/^\\+\\//, "", $1); print $1 }'
          )
          if (( ${#routing_slugs[@]} == 0 )); then
            echo "::error::Static routing lane must add at least one exact promotion-smoke redirect."
            exit 1
          fi

          npm run build:pages
          test -f dist/_redirects
          for slug in "${routing_slugs[@]}"; do
            grep -Eq "^/${slug}[[:space:]]+/[[:space:]]+302$" dist/_redirects
          done

          {
            echo "## Static routing validation"
            echo
            echo "- Exact base SHA: \`$BASE_SHA\`"
            echo "- Exact head SHA: \`$HEAD_SHA\`"
            echo "- Result: \`pass\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promotion_smoke_cleanup_validation:
    name: Promotion smoke cleanup validation
    needs: classify
    if: needs.classify.outputs.classification_succeeded == 'true' && needs.classify.outputs.lane == 'promotion-smoke-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact pull request base
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Use repository Node.js pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate promotion smoke cleanup contract
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          PATHS_JSON: ${{ needs.classify.outputs.paths_json }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node --test .github/scripts/delivery-policy.policy.mjs
          node --input-type=module <<'NODE'
          import { scanDiffForSecrets } from "./.github/scripts/docs-ci-policy.mjs";
          scanDiffForSecrets({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          NODE

          mapfile -t cleanup_paths < <(jq -r '.[]' <<<"$PATHS_JSON")
          if ! printf '%s\n' "${cleanup_paths[@]}" \
            | grep -Eq '^public/vinifera-promotion-smoke-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?\.html$'; then
            echo "::error::Promotion smoke cleanup must delete at least one hidden smoke artifact."
            exit 1
          fi
          if printf '%s\n' "${cleanup_paths[@]}" \
            | grep -Ev '^(public/_redirects|public/vinifera-promotion-smoke-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?\.html)$' \
            >/tmp/unexpected-cleanup-paths.txt; then
            echo "::error::Promotion smoke cleanup lane only permits smoke artifacts and public/_redirects."
            cat /tmp/unexpected-cleanup-paths.txt
            exit 1
          fi

          mapfile -t deleted_artifacts < <(
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- public \
              | awk '$1 == "D" && $2 ~ /^public\/vinifera-promotion-smoke-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?\.html$/ { print $2 }'
          )
          if (( ${#deleted_artifacts[@]} == 0 )); then
            echo "::error::No deleted hidden smoke artifact found in the exact diff."
            exit 1
          fi

          git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- public/_redirects > /tmp/redirects.diff
          for artifact in "${deleted_artifacts[@]}"; do
            slug="${artifact#public/}"
            slug="${slug%.html}"
            if [[ -e "$artifact" ]]; then
              echo "::error::$artifact still exists after cleanup."
              exit 1
            fi
            if ! grep -Eq "^\+/${slug}[[:space:]]+/[[:space:]]+302$" /tmp/redirects.diff \
              && ! grep -Eq "^/${slug}[[:space:]]+/[[:space:]]+302$" public/_redirects; then
              echo "::error::Missing exact redirect tombstone for $slug in the diff or resulting redirects file."
              exit 1
            fi
          done
          if grep -E '^[+-][^+-]' /tmp/redirects.diff \
            | grep -Ev '^\+/vinifera-promotion-smoke-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?[[:space:]]+/[[:space:]]+302$' \
            >/tmp/unexpected-cleanup-redirect-lines.txt; then
            echo "::error::Cleanup redirects may only add exact promotion-smoke tombstones."
            cat /tmp/unexpected-cleanup-redirect-lines.txt
            exit 1
          fi

          npm run build:pages
          test -f dist/_redirects
          for artifact in "${deleted_artifacts[@]}"; do
            slug="${artifact#public/}"
            slug="${slug%.html}"
            grep -Eq "^/${slug}[[:space:]]+/[[:space:]]+302$" dist/_redirects
          done

          {
            echo "## Promotion smoke cleanup validation"
            echo
            echo "- Exact base SHA: \`$BASE_SHA\`"
            echo "- Exact head SHA: \`$HEAD_SHA\`"
            echo "- Deleted artifacts: \`${deleted_artifacts[*]}\`"
            echo "- Result: \`pass\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release_control_validation:
    name: Release-control focused validation
    needs: classify
    if: >-
      needs.classify.outputs.classification_succeeded == 'true' &&
      (needs.classify.outputs.lane == 'ci-script-tested' ||
       needs.classify.outputs.lane == 'release-control-tested' ||
       needs.classify.outputs.lane == 'operator-tooling-tested')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact validation base
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Use repository Node.js pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release-control fast lane
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          LANE: ${{ needs.classify.outputs.lane }}
          PATHS_JSON: ${{ needs.classify.outputs.paths_json }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node --test .github/scripts/delivery-policy.policy.mjs
          node --test .github/scripts/operator-tooling-policy.policy.mjs
          npx vitest run tests/scripts --reporter verbose --testTimeout 10000
          node --input-type=module <<'NODE'
          import { scanDiffForSecrets } from "./.github/scripts/docs-ci-policy.mjs";
          scanDiffForSecrets({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          NODE

          mapfile -t release_paths < <(jq -r '.[]' <<<"$PATHS_JSON")
          if ! printf '%s\n' "${release_paths[@]}" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Release-control fast lane requires CHANGELOG.md."
            exit 1
          fi

          if [[ "$LANE" == "release-control-tested" ]]; then
            if printf '%s\n' "${release_paths[@]}" \
              | grep -Ev '^(\.github/(pull_request_template\.md|scripts/.*|workflows/.*)|AGENTS\.md|CHANGELOG\.md|docs/.*\.md|tests/scripts/.*)$' \
              >/tmp/unexpected-release-control-paths.txt; then
              echo "::error::Release-control fast lane only permits trusted workflow/controller paths, companion docs, tests/scripts, and CHANGELOG.md."
              cat /tmp/unexpected-release-control-paths.txt
              exit 1
            fi
          elif [[ "$LANE" == "operator-tooling-tested" ]]; then
            if printf '%s\n' "${release_paths[@]}" \
              | grep -Ev '^(\.github/(pull_request_template\.md|scripts/.*|workflows/.*)|CHANGELOG\.md|package\.json|scripts/(actions-promotion-status|hosted-marker-probe|promotion-smoke)\.mjs|tests/scripts/.*)$' \
              >/tmp/unexpected-operator-tooling-paths.txt; then
              echo "::error::Operator tooling fast lane only permits trusted controller/operator tooling paths."
              cat /tmp/unexpected-operator-tooling-paths.txt
              exit 1
            fi
            if printf '%s\n' "${release_paths[@]}" | grep -qx 'package.json'; then
              BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" node --input-type=module -e '
                import { validateOperatorPackageJson } from "./.github/scripts/operator-tooling-policy.mjs";
                const result = validateOperatorPackageJson({
                  baseSha: process.env.BASE_SHA,
                  headSha: process.env.HEAD_SHA,
                });
                console.log(`Validated operator package scripts: ${result.changedScripts.join(", ") || "(none)"}`);
              '
            fi
          else
            echo "::error::Unexpected focused release-control lane: $LANE"
            exit 1
          fi

          {
            echo "## Release-control focused validation"
            echo
            echo "- Exact base SHA: \`$BASE_SHA\`"
            echo "- Exact head SHA: \`$HEAD_SHA\`"
            echo "- Selected lane: \`$LANE\`"
            echo "- Result: \`pass\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency_tooling_validation:
    name: Dependency tooling validation
    needs: classify
    if: needs.classify.outputs.classification_succeeded == 'true' && needs.classify.outputs.lane == 'dependency-tooling-tested'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact validation base
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Use repository Node.js pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Export base package manifest
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git show "$BASE_SHA:package.json" > "$RUNNER_TEMP/base-package.json"

      - name: Validate dependency tooling fast lane
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          PATHS_JSON: ${{ needs.classify.outputs.paths_json }}
          MOBILE_BUILD_PROFILE: compile-only
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "false"
          VITE_MOBILE_API_ORIGIN: https://unconfigured.invalid
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node --test .github/scripts/delivery-policy.policy.mjs
          node --test .github/scripts/operator-tooling-policy.policy.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { scanDiffForSecrets } from "./.github/scripts/docs-ci-policy.mjs";
          import { validateDependencyToolingPackageJsonChange } from "./.github/scripts/delivery-policy.mjs";

          const paths = JSON.parse(process.env.PATHS_JSON || "[]");
          scanDiffForSecrets({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          const changedPackageJson = paths.includes("package.json");
          const changedPackageLock = paths.includes("package-lock.json");
          if (changedPackageJson) {
            const before = JSON.parse(
              readFileSync(
                new URL("base-package.json", `file://${process.env.RUNNER_TEMP}/`),
                "utf8",
              ),
            );
            const after = JSON.parse(readFileSync("package.json", "utf8"));
            const result = validateDependencyToolingPackageJsonChange({
              beforePackageJson: before,
              afterPackageJson: after,
            });
            if (!result.valid) {
              throw new Error(
                `Dependency tooling lane only permits package dependency/toolchain keys; rejected: ${result.disallowedKeys.join(", ")}`,
              );
            }
            const lockRequired = result.changedKeys.some((key) =>
              ["dependencies", "devDependencies", "optionalDependencies", "overrides", "peerDependencies"].includes(key),
            );
            if (lockRequired && !changedPackageLock) {
              throw new Error("Dependency graph changes must include package-lock.json.");
            }
            console.log(`Validated package.json keys: ${result.changedKeys.join(", ") || "(none)"}`);
          }
          NODE
          npm audit --audit-level=moderate
          npm run typecheck
          npm run build
          npm run build:worker
          npm run build:mobile:web

          {
            echo "## Dependency tooling validation"
            echo
            echo "- Exact base SHA: \`$BASE_SHA\`"
            echo "- Exact head SHA: \`$HEAD_SHA\`"
            echo "- Selected lane: \`dependency-tooling-tested\`"
            echo "- Checks executed: \`npm ci\`, \`git diff --check\`, policy tests, credential scan, \`npm audit\`, \`npm run typecheck\`, \`npm run build\`, \`npm run build:worker\`, \`npm run build:mobile:web\`"
            echo "- Skipped by design: database architecture checks, browser QA, Android package assembly"
            echo "- Result: \`pass\`"
          } >> "$GITHUB_STEP_SUMMARY"

  full_quality:
    name: Full type, test, build, and package
    needs: classify
    if: needs.classify.outputs.classification_succeeded == 'true' && needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact validation base
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate CI lane policy
        run: |
          node --test .github/scripts/docs-ci-policy.policy.mjs
          node --test .github/scripts/delivery-policy.policy.mjs
          node --test .github/scripts/operator-tooling-policy.policy.mjs

      - name: Check exact diff whitespace and credential patterns
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node --input-type=module <<'NODE'
          import { scanDiffForSecrets } from "./.github/scripts/docs-ci-policy.mjs";
          scanDiffForSecrets({
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
          });
          NODE

      - name: Generate Worker types
        run: npm run cf-typegen

      - name: Verify generated Worker binding types
        run: npm run qa:worker-types

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build static assets
        run: npm run build

      - name: Validate Worker bundle
        run: npm run build:worker

      - name: Validate Pages rollback artifact
        run: |
          npm run build:pages
          test -f dist/app
          grep -q "Fall 2026 Club Release" dist/app

  database_architecture:
    name: Database architecture validation
    needs: classify
    if: >-
      needs.classify.outputs.classification_succeeded == 'true' &&
      needs.classify.outputs.lane == 'full' &&
      needs.classify.outputs.database_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false

      - name: Use repository Node.js pin and lockfile cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Phase 1 through Phase 5 database architecture
        run: |
          npm run qa:db:phase1
          npm run qa:db:phase2
          npm run qa:db:phase3
          npm run qa:db:phase4
          npm run qa:db:phase5
          npm run qa:local-seed

  browser_qa:
    name: Browser QA
    needs: classify
    if: >-
      needs.classify.outputs.classification_succeeded == 'true' &&
      needs.classify.outputs.lane == 'full' &&
      needs.classify.outputs.browser_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false

      - name: Use repository Node.js pin and lockfile cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm run qa:e2e

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 90

  mobile_web:
    name: Validate shared mobile web bundle
    needs: classify
    if: >-
      needs.classify.outputs.classification_succeeded == 'true' &&
      needs.classify.outputs.lane == 'full' &&
      needs.classify.outputs.mobile_required != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false

      - name: Use repository Node.js pin and lockfile cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate shared mobile web output
        env:
          MOBILE_BUILD_PROFILE: compile-only
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "false"
          VITE_MOBILE_API_ORIGIN: https://unconfigured.invalid
        run: npm run build:mobile:web

  mobile_android:
    name: Build and lint Android shell
    needs: classify
    if: >-
      needs.classify.outputs.classification_succeeded == 'true' &&
      needs.classify.outputs.lane == 'full' &&
      needs.classify.outputs.mobile_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native identity and release configuration
        run: npm run qa:mobile:identity

      - name: Build native web bundle and synchronize Android
        env:
          MOBILE_BUILD_PROFILE: ${{ vars.VITE_MOBILE_API_ORIGIN && 'staging-runtime' || 'compile-only' }}
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "false"
          VITE_MOBILE_API_ORIGIN: ${{ vars.VITE_MOBILE_API_ORIGIN || 'https://unconfigured.invalid' }}
        run: |
          if [[ "$MOBILE_BUILD_PROFILE" == "compile-only" ]]; then
            echo "::notice::Android artifacts are compile-only and use the non-routable https://unconfigured.invalid API origin. They are not runtime QA evidence."
          else
            echo "::notice::Android artifacts are staging-runtime QA candidates; native preparation will reject any origin except the isolated vinifera-staging workers.dev target."
          fi
          npm run build:mobile:web
          npx cap sync android

      - name: Lint and assemble debug and minified release APKs
        run: ./android/gradlew -p android lintDebug assembleDebug assembleRelease --stacktrace

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-${{ vars.VITE_MOBILE_API_ORIGIN && 'staging-runtime-qa' || 'compile-only' }}-evidence
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Vinifera Promotion Gate
    if: always()
    needs:
      [
        classify,
        docs_validation,
        promotion_smoke_validation,
        static_routing_validation,
        promotion_smoke_cleanup_validation,
        release_control_validation,
        dependency_tooling_validation,
        full_quality,
        database_architecture,
        browser_qa,
        mobile_web,
        mobile_android,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce selected validation lane
        shell: bash
        env:
          CLASSIFICATION_SUCCEEDED: ${{ needs.classify.outputs.classification_succeeded }}
          LANE: ${{ needs.classify.outputs.lane }}
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs_validation.result }}
          PROMOTION_SMOKE_RESULT: ${{ needs.promotion_smoke_validation.result }}
          STATIC_ROUTING_RESULT: ${{ needs.static_routing_validation.result }}
          PROMOTION_SMOKE_CLEANUP_RESULT: ${{ needs.promotion_smoke_cleanup_validation.result }}
          RELEASE_CONTROL_RESULT: ${{ needs.release_control_validation.result }}
          DEPENDENCY_TOOLING_RESULT: ${{ needs.dependency_tooling_validation.result }}
          FULL_RESULT: ${{ needs.full_quality.result }}
          DATABASE_REQUIRED: ${{ needs.classify.outputs.database_required }}
          DATABASE_RESULT: ${{ needs.database_architecture.result }}
          BROWSER_REQUIRED: ${{ needs.classify.outputs.browser_required }}
          BROWSER_RESULT: ${{ needs.browser_qa.result }}
          MOBILE_REQUIRED: ${{ needs.classify.outputs.mobile_required }}
          MOBILE_WEB_RESULT: ${{ needs.mobile_web.result }}
          MOBILE_RESULT: ${{ needs.mobile_android.result }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Required validation policy"
            echo
            echo "- Exact base SHA: \`${BASE_SHA:-missing}\`"
            echo "- Exact head SHA: \`${HEAD_SHA:-missing}\`"
            echo "- Classifier job: \`${CLASSIFIER_RESULT}\`"
            echo "- Classification succeeded: \`${CLASSIFICATION_SUCCEEDED:-missing}\`"
            echo "- Selected lane: \`${LANE:-missing}\`"
            echo "- Documentation job: \`${DOCS_RESULT}\`"
            echo "- Promotion smoke job: \`${PROMOTION_SMOKE_RESULT}\`"
            echo "- Static routing job: \`${STATIC_ROUTING_RESULT}\`"
            echo "- Promotion smoke cleanup job: \`${PROMOTION_SMOKE_CLEANUP_RESULT}\`"
            echo "- Release-control focused job: \`${RELEASE_CONTROL_RESULT}\`"
            echo "- Dependency tooling job: \`${DEPENDENCY_TOOLING_RESULT}\`"
            echo "- Full quality job: \`${FULL_RESULT}\`"
            echo "- Database QA required: \`${DATABASE_REQUIRED:-missing}\`"
            echo "- Database architecture job: \`${DATABASE_RESULT}\`"
            echo "- Browser QA required: \`${BROWSER_REQUIRED:-missing}\`"
            echo "- Browser QA job: \`${BROWSER_RESULT}\`"
            echo "- Android required: \`${MOBILE_REQUIRED:-missing}\`"
            echo "- Shared mobile web job: \`${MOBILE_WEB_RESULT}\`"
            echo "- Android job: \`${MOBILE_RESULT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CLASSIFIER_RESULT" != "success" ||
                "$CLASSIFICATION_SUCCEEDED" != "true" ]]; then
            echo "::error::Change classification did not succeed."
            exit 1
          fi

          case "$LANE" in
            noop)
              if [[ "$DOCS_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_RESULT" != "skipped" ||
                    "$STATIC_ROUTING_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "skipped" ||
                    "$RELEASE_CONTROL_RESULT" != "skipped" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "skipped" ||
                    "$FULL_RESULT" != "skipped" ||
                    "$DATABASE_RESULT" != "skipped" ||
                    "$BROWSER_RESULT" != "skipped" ||
                    "$MOBILE_WEB_RESULT" != "skipped" ||
                    "$MOBILE_RESULT" != "skipped" ]]; then
                echo "::error::No-op lane unexpectedly ran validation work."
                exit 1
              fi
              ;;
            docs)
              if [[ "$DOCS_RESULT" != "success" ||
                    "$PROMOTION_SMOKE_RESULT" != "skipped" ||
                    "$STATIC_ROUTING_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "skipped" ||
                    "$RELEASE_CONTROL_RESULT" != "skipped" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "skipped" ||
                    "$FULL_RESULT" != "skipped" ||
                    "$DATABASE_RESULT" != "skipped" ||
                    "$BROWSER_RESULT" != "skipped" ||
                    "$MOBILE_WEB_RESULT" != "skipped" ||
                    "$MOBILE_RESULT" != "skipped" ]]; then
                echo "::error::Documentation lane did not run exclusively and pass."
                exit 1
              fi
              ;;
            promotion-smoke)
              if [[ "$DOCS_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_RESULT" != "success" ||
                    "$STATIC_ROUTING_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "skipped" ||
                    "$RELEASE_CONTROL_RESULT" != "skipped" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "skipped" ||
                    "$FULL_RESULT" != "skipped" ||
                    "$DATABASE_RESULT" != "skipped" ||
                    "$BROWSER_RESULT" != "skipped" ||
                    "$MOBILE_WEB_RESULT" != "skipped" ||
                    "$MOBILE_RESULT" != "skipped" ]]; then
                echo "::error::Promotion smoke lane did not run exclusively and pass."
                exit 1
              fi
              ;;
            static-routing)
              if [[ "$DOCS_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_RESULT" != "skipped" ||
                    "$STATIC_ROUTING_RESULT" != "success" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "skipped" ||
                    "$RELEASE_CONTROL_RESULT" != "skipped" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "skipped" ||
                    "$FULL_RESULT" != "skipped" ||
                    "$DATABASE_RESULT" != "skipped" ||
                    "$BROWSER_RESULT" != "skipped" ||
                    "$MOBILE_WEB_RESULT" != "skipped" ||
                    "$MOBILE_RESULT" != "skipped" ]]; then
                echo "::error::Static routing lane did not run exclusively and pass."
                exit 1
              fi
              ;;
            promotion-smoke-cleanup)
              if [[ "$DOCS_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_RESULT" != "skipped" ||
                    "$STATIC_ROUTING_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "success" ||
                    "$RELEASE_CONTROL_RESULT" != "skipped" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "skipped" ||
                    "$FULL_RESULT" != "skipped" ||
                    "$DATABASE_RESULT" != "skipped" ||
                    "$BROWSER_RESULT" != "skipped" ||
                    "$MOBILE_WEB_RESULT" != "skipped" ||
                    "$MOBILE_RESULT" != "skipped" ]]; then
                echo "::error::Promotion smoke cleanup lane did not run exclusively and pass."
                exit 1
              fi
              ;;
            release-control-tested|operator-tooling-tested)
              if [[ "$DOCS_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_RESULT" != "skipped" ||
                    "$STATIC_ROUTING_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "skipped" ||
                    "$RELEASE_CONTROL_RESULT" != "success" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "skipped" ||
                    "$FULL_RESULT" != "skipped" ||
                    "$DATABASE_RESULT" != "skipped" ||
                    "$BROWSER_RESULT" != "skipped" ||
                    "$MOBILE_WEB_RESULT" != "skipped" ||
                    "$MOBILE_RESULT" != "skipped" ]]; then
                echo "::error::Focused release-control fast lane did not run exclusively and pass."
                exit 1
              fi
              ;;
            dependency-tooling-tested)
              if [[ "$DOCS_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_RESULT" != "skipped" ||
                    "$STATIC_ROUTING_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "skipped" ||
                    "$RELEASE_CONTROL_RESULT" != "skipped" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "success" ||
                    "$FULL_RESULT" != "skipped" ||
                    "$DATABASE_RESULT" != "skipped" ||
                    "$BROWSER_RESULT" != "skipped" ||
                    "$MOBILE_WEB_RESULT" != "skipped" ||
                    "$MOBILE_RESULT" != "skipped" ]]; then
                echo "::error::Dependency tooling fast lane did not run exclusively and pass."
                exit 1
              fi
              ;;
            full)
              if [[ "$DOCS_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_RESULT" != "skipped" ||
                    "$STATIC_ROUTING_RESULT" != "skipped" ||
                    "$PROMOTION_SMOKE_CLEANUP_RESULT" != "skipped" ||
                    "$RELEASE_CONTROL_RESULT" != "skipped" ||
                    "$DEPENDENCY_TOOLING_RESULT" != "skipped" ||
                    "$FULL_RESULT" != "success" ]]; then
                echo "::error::Full quality lane did not run exclusively and pass."
                exit 1
              fi
              if [[ "$DATABASE_REQUIRED" == "true" ]]; then
                if [[ "$DATABASE_RESULT" != "success" ]]; then
                  echo "::error::Required database architecture validation did not run and pass."
                  exit 1
                fi
              elif [[ "$DATABASE_REQUIRED" == "false" ]]; then
                if [[ "$DATABASE_RESULT" != "skipped" ]]; then
                  echo "::error::Database architecture validation ran for a path that does not require it."
                  exit 1
                fi
              else
                echo "::error::Database selection is missing or ambiguous."
                exit 1
              fi
              if [[ "$BROWSER_REQUIRED" == "true" ]]; then
                if [[ "$BROWSER_RESULT" != "success" ]]; then
                  echo "::error::Required browser QA did not run and pass."
                  exit 1
                fi
              elif [[ "$BROWSER_REQUIRED" == "false" ]]; then
                if [[ "$BROWSER_RESULT" != "skipped" ]]; then
                  echo "::error::Browser QA ran for a path that does not require it."
                  exit 1
                fi
              else
                echo "::error::Browser selection is missing or ambiguous."
                exit 1
              fi
              if [[ "$MOBILE_REQUIRED" == "true" ]]; then
                if [[ "$MOBILE_WEB_RESULT" != "skipped" ||
                      "$MOBILE_RESULT" != "success" ]]; then
                  echo "::error::Required Android validation did not run exclusively and pass."
                  exit 1
                fi
              elif [[ "$MOBILE_REQUIRED" == "false" ]]; then
                if [[ "$MOBILE_WEB_RESULT" != "success" ||
                      "$MOBILE_RESULT" != "skipped" ]]; then
                  echo "::error::Required shared mobile web validation did not run exclusively and pass."
                  exit 1
                fi
              else
                echo "::error::Android selection is missing or ambiguous."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown or missing validation lane."
              exit 1
              ;;
          esac

          echo "- Policy result: \`pass\`" >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Apply Supabase migrations when activated
    needs: [quality]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/staging' &&
      vars.STAGING_SUPABASE_MIGRATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0

      - name: Detect migration activation
        id: activation
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" && -n "$SUPABASE_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Staging migration was explicitly enabled, but staging-scoped Supabase credentials are incomplete."
            exit 1
          fi

      - name: Verify allowlisted staging Supabase target
        if: steps.activation.outputs.ready == 'true'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: node scripts/verify-staging-activation.mjs verify-target supabase

      - name: Install Supabase CLI
        if: steps.activation.outputs.ready == 'true'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Link project and apply migrations
        if: steps.activation.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
          supabase test db --linked

  deploy-staging:
    name: Deploy Worker when activated
    needs: [quality, database]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/staging' &&
      vars.STAGING_CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate staging activation and sandbox credentials
        id: activation
        shell: bash
        env:
          APNS_ENVIRONMENT: ${{ secrets.STAGING_APNS_ENVIRONMENT }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.STAGING_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_CF_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN: ${{ secrets.STAGING_CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.STAGING_CLOUDFLARE_ZONE_ID }}
          COMPLIANCE_PROVIDER: ${{ secrets.STAGING_COMPLIANCE_PROVIDER }}
          EASYPOST_API_KEY: ${{ secrets.STAGING_EASYPOST_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.STAGING_FCM_PROJECT_ID }}
          MEMBER_BRAND_CONTEXT_SECRET: ${{ secrets.STAGING_MEMBER_BRAND_CONTEXT_SECRET }}
          QUICKBOOKS_ENVIRONMENT: ${{ secrets.STAGING_QUICKBOOKS_ENVIRONMENT }}
          RATE_LIMIT_PEPPER: ${{ secrets.STAGING_RATE_LIMIT_PEPPER }}
          SHIPCOMPLIANT_BASE_URL: ${{ secrets.STAGING_SHIPCOMPLIANT_BASE_URL }}
          SHIPCOMPLIANT_ENDPOINT_MODE: ${{ secrets.STAGING_SHIPCOMPLIANT_ENDPOINT_MODE }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { assertSecuritySecretSeparation } from "./scripts/lib/security-secret-guard.mjs";
          assertSecuritySecretSeparation(process.env);
          console.log("Verified independent staging security-secret bindings.");
          NODE
          if [[ -n "$STRIPE_SECRET_KEY" && "$STRIPE_SECRET_KEY" != sk_test_* ]]; then
            echo "::error::The staging Worker accepts only a Stripe sk_test_* secret."
            exit 1
          fi
          if [[ -n "$QUICKBOOKS_ENVIRONMENT" && "$QUICKBOOKS_ENVIRONMENT" != "sandbox" ]]; then
            echo "::error::The staging Worker accepts only QUICKBOOKS_ENVIRONMENT=sandbox."
            exit 1
          fi
          if [[ -n "$APNS_ENVIRONMENT" && "$APNS_ENVIRONMENT" != "sandbox" ]]; then
            echo "::error::The staging Worker accepts only APNS_ENVIRONMENT=sandbox."
            exit 1
          fi
          if [[ -n "$EASYPOST_API_KEY" && "$EASYPOST_API_KEY" != EZTK* ]]; then
            echo "::error::The staging Worker accepts only an EasyPost EZTK test key."
            exit 1
          fi
          if [[ -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "::error::The Access-protected staging Supabase ingress requires a complete service-token pair."
            exit 1
          fi
          if [[ "$COMPLIANCE_PROVIDER" == "shipcompliant" &&
                "$SHIPCOMPLIANT_ENDPOINT_MODE" != "sandbox" ]]; then
            echo "::error::The staging Worker accepts only ShipCompliant sandbox mode."
            exit 1
          fi
          if [[ -n "$CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN" ||
                -n "$CLOUDFLARE_ZONE_ID" ]]; then
            [[ -n "$CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN" &&
               -n "$CLOUDFLARE_ZONE_ID" ]] || {
              echo "::error::Staging Cloudflare custom-hostname target metadata is incomplete."
              exit 1
            }
          fi
          if [[ "$COMPLIANCE_PROVIDER" == "shipcompliant" &&
                -z "$SHIPCOMPLIANT_BASE_URL" ]]; then
            echo "::error::Staging ShipCompliant sandbox origin is missing."
            exit 1
          fi
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Staging deployment was explicitly enabled, but staging-scoped Cloudflare credentials are incomplete."
            exit 1
          fi

      - name: Use Node.js
        if: steps.activation.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Resolve the selected immutable release package
        if: steps.activation.outputs.ready == 'true'
        id: release-package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STAGING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/commits/$STAGING_SHA/pulls")
          promotion_pr=$(jq -c \
            --arg repository "$REPOSITORY" \
            --arg staging_sha "$STAGING_SHA" \
            '[.[] |
              select(.merged_at != null) |
              select(.base.ref == "staging") |
              select(.head.ref == "dev") |
              select(.merge_commit_sha == $staging_sha) |
              select(.head.repo.full_name == $repository)] |
             sort_by(.merged_at) | last // empty' <<<"$prs")
          candidate_sha=$(jq -r '.head.sha // empty' <<<"$promotion_pr")
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Staging must come from one merged dev-to-staging candidate."
            exit 1
          fi
          if jq -e \
            'any(.labels[]?; .name == "human-review-required" or .name == "do-not-merge")' \
            <<<"$promotion_pr" >/dev/null; then
            echo "::error::The staging candidate is paused by an emergency label."
            exit 1
          fi
          git fetch --no-tags origin "$candidate_sha"
          if [[ "$(git rev-parse "$candidate_sha^{tree}")" \
            != "$(git rev-parse "$STAGING_SHA^{tree}")" ]]; then
            echo "::error::Staging tree differs from the selected dev candidate."
            exit 1
          fi
          package_run_id=""
          while IFS= read -r run_id; do
            artifacts=$(gh api \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")
            if jq -e \
              --arg name "release-candidate-$candidate_sha" \
              'any(.artifacts[]?; .name == $name and .expired == false)' \
              <<<"$artifacts" >/dev/null; then
              package_run_id="$run_id"
              break
            fi
          done < <(
            gh api --paginate \
              "repos/$REPOSITORY/actions/workflows/release-candidate-package.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=100" \
              | jq -r '.workflow_runs[] | .id'
          )
          if [[ ! "$package_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::No successful immutable package exists for this candidate."
            exit 1
          fi
          printf 'candidate_sha=%s\nrun_id=%s\n' \
            "$candidate_sha" "$package_run_id" >> "$GITHUB_OUTPUT"

      - name: Download the exact selected release package
        if: steps.activation.outputs.ready == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release-package.outputs.run_id }}
          name: release-candidate-${{ steps.release-package.outputs.candidate_sha }}
          path: release

      - name: Verify all configured staging provider targets and artifact
        if: steps.activation.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN: ${{ secrets.STAGING_CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.STAGING_CLOUDFLARE_ZONE_ID }}
          COMPLIANCE_PROVIDER: ${{ secrets.STAGING_COMPLIANCE_PROVIDER }}
          FCM_PROJECT_ID: ${{ secrets.STAGING_FCM_PROJECT_ID }}
          SHIPCOMPLIANT_BASE_URL: ${{ secrets.STAGING_SHIPCOMPLIANT_BASE_URL }}
        run: |
          npm ci
          node scripts/release-artifact.mjs verify \
            "${{ steps.release-package.outputs.candidate_sha }}" \
            release/worker/worker.js \
            release/dist \
            release/manifest.json
          node scripts/verify-staging-activation.mjs verify-target cloudflare
          if [[ -n "$CLOUDFLARE_ZONE_ID" ]]; then
            node scripts/verify-staging-activation.mjs verify-target cloudflare-zone
            node scripts/verify-staging-activation.mjs verify-custom-hostname-origin
          fi
          if [[ -n "$FCM_PROJECT_ID" ]]; then
            node scripts/verify-staging-activation.mjs verify-target fcm-project
          fi
          if [[ "$COMPLIANCE_PROVIDER" == "shipcompliant" ]]; then
            node scripts/verify-staging-activation.mjs verify-target shipcompliant-origin
          fi

      - name: Verify configured Stripe test catalog semantics
        if: steps.activation.outputs.ready == 'true'
        env:
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_PRICE_CELLAR: ${{ secrets.STAGING_STRIPE_PRICE_CELLAR }}
          STAGING_STRIPE_PRICE_ESTATE: ${{ secrets.STAGING_STRIPE_PRICE_ESTATE }}
          STAGING_STRIPE_PRICE_RESERVE: ${{ secrets.STAGING_STRIPE_PRICE_RESERVE }}
          STAGING_STRIPE_PRICE_VINE: ${{ secrets.STAGING_STRIPE_PRICE_VINE }}
          STRIPE_CATALOG_CONFIRMATION: VERIFY VINIFERA STRIPE TEST CATALOG
          STRIPE_CATALOG_GIT_SHA: ${{ github.sha }}
        run: |
          umask 077
          node scripts/stripe-test-catalog.mjs \
            verify \
            --output "$RUNNER_TEMP/stripe-test-catalog-verification.json" \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Prepare available Worker secrets
        id: worker-secrets
        if: steps.activation.outputs.ready == 'true'
        shell: bash
        env:
          AUTH_EMAIL_ENABLED: ${{ secrets.STAGING_AUTH_EMAIL_ENABLED }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.STAGING_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_CF_ACCESS_CLIENT_SECRET }}
          APNS_BUNDLE_ID: ${{ secrets.STAGING_APNS_BUNDLE_ID }}
          APNS_ENVIRONMENT: ${{ secrets.STAGING_APNS_ENVIRONMENT }}
          APNS_KEY_ID: ${{ secrets.STAGING_APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.STAGING_APNS_PRIVATE_KEY }}
          APNS_TEAM_ID: ${{ secrets.STAGING_APNS_TEAM_ID }}
          CLOUDFLARE_CUSTOM_HOSTNAME_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_CUSTOM_HOSTNAME_API_TOKEN }}
          CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN: ${{ secrets.STAGING_CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.STAGING_CLOUDFLARE_ZONE_ID }}
          COMPLIANCE_PROVIDER: ${{ secrets.STAGING_COMPLIANCE_PROVIDER }}
          COMPLIANCE_SIMULATOR_ENABLED: ${{ secrets.STAGING_COMPLIANCE_SIMULATOR_ENABLED }}
          EASYPOST_API_KEY: ${{ secrets.STAGING_EASYPOST_API_KEY }}
          EASYPOST_LIVE_LABELS_ENABLED: "false"
          EMAIL_PROVIDER: ${{ secrets.STAGING_EMAIL_PROVIDER }}
          EMAIL_SIMULATOR_ENABLED: ${{ secrets.STAGING_EMAIL_SIMULATOR_ENABLED }}
          FCM_CLIENT_EMAIL: ${{ secrets.STAGING_FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.STAGING_FCM_PRIVATE_KEY }}
          FCM_PROJECT_ID: ${{ secrets.STAGING_FCM_PROJECT_ID }}
          GOOGLE_OAUTH_ENABLED: ${{ secrets.STAGING_GOOGLE_OAUTH_ENABLED }}
          INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION: ${{ secrets.STAGING_INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION }}
          INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS: ${{ secrets.STAGING_INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS }}
          MEMBER_BRAND_CONTEXT_SECRET: ${{ secrets.STAGING_MEMBER_BRAND_CONTEXT_SECRET }}
          ML_PLATFORM_ACTOR_USER_ID: ${{ secrets.STAGING_ML_PLATFORM_ACTOR_USER_ID }}
          MOBILE_ANDROID_LATEST_VERSION: ${{ secrets.STAGING_MOBILE_ANDROID_LATEST_VERSION }}
          MOBILE_ANDROID_MINIMUM_VERSION: ${{ secrets.STAGING_MOBILE_ANDROID_MINIMUM_VERSION }}
          MOBILE_ANDROID_PACKAGE_NAME: ${{ secrets.STAGING_MOBILE_ANDROID_PACKAGE_NAME }}
          MOBILE_ANDROID_SIGNING_CERT_SHA256: ${{ secrets.STAGING_MOBILE_ANDROID_SIGNING_CERT_SHA256 }}
          MOBILE_ANDROID_STORE_URL: ${{ secrets.STAGING_MOBILE_ANDROID_STORE_URL }}
          MOBILE_APPLE_TEAM_ID: ${{ secrets.STAGING_MOBILE_APPLE_TEAM_ID }}
          MOBILE_AUTH_EMAIL_TEMPLATE_ENABLED: ${{ secrets.STAGING_MOBILE_AUTH_EMAIL_TEMPLATE_ENABLED }}
          MOBILE_AUTH_STATE_SIGNING_SECRET: ${{ secrets.STAGING_MOBILE_AUTH_STATE_SIGNING_SECRET }}
          MOBILE_IOS_BUNDLE_ID: ${{ secrets.STAGING_MOBILE_IOS_BUNDLE_ID }}
          MOBILE_IOS_LATEST_VERSION: ${{ secrets.STAGING_MOBILE_IOS_LATEST_VERSION }}
          MOBILE_IOS_MINIMUM_VERSION: ${{ secrets.STAGING_MOBILE_IOS_MINIMUM_VERSION }}
          MOBILE_IOS_STORE_URL: ${{ secrets.STAGING_MOBILE_IOS_STORE_URL }}
          QUICKBOOKS_CLIENT_ID: ${{ secrets.STAGING_QUICKBOOKS_CLIENT_ID }}
          QUICKBOOKS_CLIENT_SECRET: ${{ secrets.STAGING_QUICKBOOKS_CLIENT_SECRET }}
          QUICKBOOKS_ENVIRONMENT: ${{ secrets.STAGING_QUICKBOOKS_ENVIRONMENT }}
          QUICKBOOKS_REDIRECT_URI: ${{ secrets.STAGING_QUICKBOOKS_REDIRECT_URI }}
          QUICKBOOKS_STATE_SIGNING_SECRET: ${{ secrets.STAGING_QUICKBOOKS_STATE_SIGNING_SECRET }}
          RATE_LIMIT_PEPPER: ${{ secrets.STAGING_RATE_LIMIT_PEPPER }}
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          RESEND_DOMAIN_VERIFIED: ${{ secrets.STAGING_RESEND_DOMAIN_VERIFIED }}
          RESEND_FROM: ${{ secrets.STAGING_RESEND_FROM }}
          RESEND_SENDING_DOMAIN: ${{ secrets.STAGING_RESEND_SENDING_DOMAIN }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.STAGING_RESEND_WEBHOOK_SECRET }}
          SHIPPING_PROVIDER: ${{ secrets.STAGING_SHIPPING_PROVIDER }}
          SHIPPING_SIMULATOR_ENABLED: ${{ secrets.STAGING_SHIPPING_SIMULATOR_ENABLED }}
          SHIPCOMPLIANT_ACCOUNT_ID: ${{ secrets.STAGING_SHIPCOMPLIANT_ACCOUNT_ID }}
          SHIPCOMPLIANT_API_KEY: ${{ secrets.STAGING_SHIPCOMPLIANT_API_KEY }}
          SHIPCOMPLIANT_API_SECRET: ${{ secrets.STAGING_SHIPCOMPLIANT_API_SECRET }}
          SHIPCOMPLIANT_BASE_URL: ${{ secrets.STAGING_SHIPCOMPLIANT_BASE_URL }}
          SHIPCOMPLIANT_CHECK_PATH: ${{ secrets.STAGING_SHIPCOMPLIANT_CHECK_PATH }}
          SHIPCOMPLIANT_CONTRACT_VERSION: ${{ secrets.STAGING_SHIPCOMPLIANT_CONTRACT_VERSION }}
          SHIPCOMPLIANT_ENDPOINT_MODE: ${{ secrets.STAGING_SHIPCOMPLIANT_ENDPOINT_MODE }}
          SHIPCOMPLIANT_LICENSE_ID: ${{ secrets.STAGING_SHIPCOMPLIANT_LICENSE_ID }}
          SHIPCOMPLIANT_TOKEN_PATH: ${{ secrets.STAGING_SHIPCOMPLIANT_TOKEN_PATH }}
          STRIPE_PRICE_CELLAR: ${{ secrets.STAGING_STRIPE_PRICE_CELLAR }}
          STRIPE_PRICE_ESTATE: ${{ secrets.STAGING_STRIPE_PRICE_ESTATE }}
          STRIPE_PRICE_RESERVE: ${{ secrets.STAGING_STRIPE_PRICE_RESERVE }}
          STRIPE_PRICE_VINE: ${{ secrets.STAGING_STRIPE_PRICE_VINE }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          UNSUBSCRIBE_SIGNING_SECRET: ${{ secrets.STAGING_UNSUBSCRIBE_SIGNING_SECRET }}
        run: |
          umask 077
          secret_file="$RUNNER_TEMP/vinifera-worker-secrets.json"
          node --input-type=module <<'NODE' > "$secret_file"
          const names = [
            "APNS_BUNDLE_ID",
            "APNS_ENVIRONMENT",
            "APNS_KEY_ID",
            "APNS_PRIVATE_KEY",
            "APNS_TEAM_ID",
            "AUTH_EMAIL_ENABLED",
            "CF_ACCESS_CLIENT_ID",
            "CF_ACCESS_CLIENT_SECRET",
            "CLOUDFLARE_CUSTOM_HOSTNAME_API_TOKEN",
            "CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN",
            "CLOUDFLARE_ZONE_ID",
            "COMPLIANCE_PROVIDER",
            "COMPLIANCE_SIMULATOR_ENABLED",
            "EASYPOST_API_KEY",
            "EASYPOST_LIVE_LABELS_ENABLED",
            "EMAIL_PROVIDER",
            "EMAIL_SIMULATOR_ENABLED",
            "FCM_CLIENT_EMAIL",
            "FCM_PRIVATE_KEY",
            "FCM_PROJECT_ID",
            "GOOGLE_OAUTH_ENABLED",
            "INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION",
            "INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS",
            "MEMBER_BRAND_CONTEXT_SECRET",
            "ML_PLATFORM_ACTOR_USER_ID",
            "MOBILE_ANDROID_LATEST_VERSION",
            "MOBILE_ANDROID_MINIMUM_VERSION",
            "MOBILE_ANDROID_PACKAGE_NAME",
            "MOBILE_ANDROID_SIGNING_CERT_SHA256",
            "MOBILE_ANDROID_STORE_URL",
            "MOBILE_APPLE_TEAM_ID",
            "MOBILE_AUTH_EMAIL_TEMPLATE_ENABLED",
            "MOBILE_AUTH_STATE_SIGNING_SECRET",
            "MOBILE_IOS_BUNDLE_ID",
            "MOBILE_IOS_LATEST_VERSION",
            "MOBILE_IOS_MINIMUM_VERSION",
            "MOBILE_IOS_STORE_URL",
            "QUICKBOOKS_CLIENT_ID",
            "QUICKBOOKS_CLIENT_SECRET",
            "QUICKBOOKS_ENVIRONMENT",
            "QUICKBOOKS_REDIRECT_URI",
            "QUICKBOOKS_STATE_SIGNING_SECRET",
            "RATE_LIMIT_PEPPER",
            "RESEND_API_KEY",
            "RESEND_DOMAIN_VERIFIED",
            "RESEND_FROM",
            "RESEND_SENDING_DOMAIN",
            "RESEND_WEBHOOK_SECRET",
            "SHIPPING_PROVIDER",
            "SHIPPING_SIMULATOR_ENABLED",
            "SHIPCOMPLIANT_ACCOUNT_ID",
            "SHIPCOMPLIANT_API_KEY",
            "SHIPCOMPLIANT_API_SECRET",
            "SHIPCOMPLIANT_BASE_URL",
            "SHIPCOMPLIANT_CHECK_PATH",
            "SHIPCOMPLIANT_CONTRACT_VERSION",
            "SHIPCOMPLIANT_ENDPOINT_MODE",
            "SHIPCOMPLIANT_LICENSE_ID",
            "SHIPCOMPLIANT_TOKEN_PATH",
            "STRIPE_PRICE_CELLAR",
            "STRIPE_PRICE_ESTATE",
            "STRIPE_PRICE_RESERVE",
            "STRIPE_PRICE_VINE",
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "SUPABASE_ANON_KEY",
            "SUPABASE_PUBLISHABLE_KEY",
            "SUPABASE_SECRET_KEY",
            "SUPABASE_SERVICE_ROLE_KEY",
            "SUPABASE_URL",
            "UNSUBSCRIBE_SIGNING_SECRET"
          ];
          const values = Object.fromEntries(
            names
              .filter((name) => process.env[name])
              .map((name) => [name, process.env[name]])
          );
          process.stdout.write(JSON.stringify(values));
          NODE
          secret_count="$(jq 'length' "$secret_file")"
          echo "path=$secret_file" >> "$GITHUB_OUTPUT"
          echo "count=$secret_count" >> "$GITHUB_OUTPUT"
          echo "::notice::$secret_count configured runtime secrets will be uploaded atomically with the staging Worker version."

      - name: Deploy isolated staging Worker
        if: steps.activation.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_WORKER_ORIGIN: ${{ vars.STAGING_WORKER_ORIGIN }}
        run: |
          deploy_log="$RUNNER_TEMP/vinifera-staging-deploy.log"
          if [[ "${{ steps.worker-secrets.outputs.count }}" -gt 0 ]]; then
            npx wrangler versions upload release/worker/worker.js \
              --no-bundle --assets release/dist --env staging --strict \
              --secrets-file "${{ steps.worker-secrets.outputs.path }}" \
              --var "APP_ENV:staging" \
              --var "APP_ORIGIN:$STAGING_WORKER_ORIGIN" \
              --var "ALLOWED_ORIGINS:$STAGING_WORKER_ORIGIN,capacitor://localhost,https://localhost" \
              --var "LIVE_BILLING_ENABLED:false" \
              --var "DEPLOY_GIT_SHA:${{ steps.release-package.outputs.candidate_sha }}" \
              --tag "candidate-${{ steps.release-package.outputs.candidate_sha }}" \
              --message "vinifera staging candidate=${{ steps.release-package.outputs.candidate_sha }} artifact_sha256=$(jq -r '.artifactSha256' release/manifest.json)" \
              | tee "$deploy_log"
          else
            npx wrangler versions upload release/worker/worker.js \
              --no-bundle --assets release/dist --env staging --strict \
              --var "APP_ENV:staging" \
              --var "APP_ORIGIN:$STAGING_WORKER_ORIGIN" \
              --var "ALLOWED_ORIGINS:$STAGING_WORKER_ORIGIN,capacitor://localhost,https://localhost" \
              --var "LIVE_BILLING_ENABLED:false" \
              --var "DEPLOY_GIT_SHA:${{ steps.release-package.outputs.candidate_sha }}" \
              --tag "candidate-${{ steps.release-package.outputs.candidate_sha }}" \
              --message "vinifera staging candidate=${{ steps.release-package.outputs.candidate_sha }} artifact_sha256=$(jq -r '.artifactSha256' release/manifest.json)" \
              | tee "$deploy_log"
          fi
          node scripts/production-release.mjs parse-staging-upload \
            "$deploy_log" "$RUNNER_TEMP/staging-upload.json" \
            "$STAGING_WORKER_ORIGIN"
          version_id=$(jq -r '.versionId' "$RUNNER_TEMP/staging-upload.json")
          staging_url=$(jq -r '.previewUrl' "$RUNNER_TEMP/staging-upload.json")
          if [[ ! "$version_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::Wrangler did not report the immutable staging version."
            exit 1
          fi
          if [[ -z "$staging_url" ]]; then
            echo "::error::Wrangler did not report an isolated staging preview URL."
            exit 1
          fi
          npx wrangler versions deploy "$version_id@100%" --env staging -y
          node scripts/verify-hosted-runtime.mjs \
            --origin "$staging_url" \
            --expected-revision "${{ steps.release-package.outputs.candidate_sha }}" \
            --output "$RUNNER_TEMP/vinifera-staging-runtime.json"
          jq -n \
            --arg artifact_sha256 "$(jq -r '.artifactSha256' release/manifest.json)" \
            --arg candidate_sha "${{ steps.release-package.outputs.candidate_sha }}" \
            --arg package_run_id "${{ steps.release-package.outputs.run_id }}" \
            --arg version_id "$version_id" \
            '{
              artifactSha256: $artifact_sha256,
              candidateSha: $candidate_sha,
              environment: "staging",
              liveVerified: true,
              packageRunId: $package_run_id,
              versionId: $version_id
            }' > "$RUNNER_TEMP/vinifera-staging-release.json"
          echo "### Staging Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $staging_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate: ${{ steps.release-package.outputs.candidate_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact SHA-256: $(jq -r '.artifactSha256' release/manifest.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker version: $version_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime secrets uploaded with this version: ${{ steps.worker-secrets.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Core app, database, Stripe test billing, security-secret separation, and webhook capabilities: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native hosted pgTAP/RLS gate: passed in the database job" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production custom-domain cutover: deferred and human-controlled" >> "$GITHUB_STEP_SUMMARY"

      - name: Run hosted Gate 7 acceptance when activated
        if: steps.activation.outputs.ready == 'true' && vars.STAGING_HOSTED_ACCEPTANCE_ENABLED == 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.STAGING_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_CF_ACCESS_CLIENT_SECRET }}
          HOSTED_ACCEPTANCE_EMAIL_BASE: ${{ vars.STAGING_HOSTED_ACCEPTANCE_EMAIL_BASE }}
          HOSTED_ACCEPTANCE_ENVIRONMENT: staging
          HOSTED_ACCEPTANCE_HANDOFF_VARIABLE: STAGING_HOSTED_ACCEPTANCE_MAGIC_LINK_HANDOFF
          HOSTED_ACCEPTANCE_GITHUB_TOKEN: ${{ secrets.STAGING_GITHUB_VARIABLES_TOKEN }}
          HOSTED_ACCEPTANCE_LINK_ENVELOPE_VARIABLE: STAGING_HOSTED_ACCEPTANCE_MAGIC_LINK_ENVELOPE
          STAGING_WORKER_ORIGIN: ${{ vars.STAGING_WORKER_ORIGIN }}
          STRIPE_PRICE_VINE: ${{ secrets.STAGING_STRIPE_PRICE_VINE }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          node scripts/hosted-gate7-acceptance.mjs \
            --output "$RUNNER_TEMP/vinifera-hosted-gate7-acceptance.json"
          echo "### Hosted Gate 7 acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Two-tenant staff and native RLS isolation: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Member magic-link callback and cookie session: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stripe test Checkout, signed webhook idempotency, grace, restriction, suspension, and recovery: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dedicated staging fixtures restored to their reusable baseline: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect requested Gates 10-16 readiness evidence
        id: hosted-gates10-16
        if: always() && steps.activation.outputs.ready == 'true'
        continue-on-error: true
        env:
          ML_PLATFORM_ACTOR_USER_ID: ${{ secrets.STAGING_ML_PLATFORM_ACTOR_USER_ID }}
          STAGING_GATE_10_EVIDENCE_ENABLED: ${{ vars.STAGING_GATE_10_EVIDENCE_ENABLED }}
          STAGING_GATE_11_EVIDENCE_ENABLED: ${{ vars.STAGING_GATE_11_EVIDENCE_ENABLED }}
          STAGING_GATE_12_EVIDENCE_ENABLED: ${{ vars.STAGING_GATE_12_EVIDENCE_ENABLED }}
          STAGING_GATE_13_EVIDENCE_ENABLED: ${{ vars.STAGING_GATE_13_EVIDENCE_ENABLED }}
          STAGING_GATE_14_EVIDENCE_ENABLED: ${{ vars.STAGING_GATE_14_EVIDENCE_ENABLED }}
          STAGING_GATE_15_EVIDENCE_ENABLED: ${{ vars.STAGING_GATE_15_EVIDENCE_ENABLED }}
          STAGING_GATE_16_EVIDENCE_ENABLED: ${{ vars.STAGING_GATE_16_EVIDENCE_ENABLED }}
          STAGING_WORKER_ORIGIN: ${{ vars.STAGING_WORKER_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hosted-gates10-16-readiness"
          mkdir -p "$evidence_dir"
          requested=false
          failed=false
          ml_actor_configured=false
          if [[ -n "$ML_PLATFORM_ACTOR_USER_ID" ]]; then
            ml_actor_configured=true
          fi

          for gate in 10 11 12 13 14 15 16; do
            toggle_name="STAGING_GATE_${gate}_EVIDENCE_ENABLED"
            if [[ "${!toggle_name:-}" != "true" ]]; then
              continue
            fi
            requested=true
            report="$evidence_dir/gate-${gate}.json"
            set +e
            node scripts/hosted-gates10-16-evidence.mjs \
              --gate "$gate" \
              --expected-revision "${{ steps.release-package.outputs.candidate_sha }}" \
              --origin "$STAGING_WORKER_ORIGIN" \
              --enabled true \
              --confirmation "COLLECT VINIFERA GATE ${gate} READINESS EVIDENCE" \
              --ml-actor-configured "$ml_actor_configured" \
              --output "$report"
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              failed=true
            fi
          done

          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "directory=$evidence_dir" >> "$GITHUB_OUTPUT"
          if [[ "$requested" == "false" ]]; then
            echo "No Gates 10-16 readiness evidence was requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -s \
            --arg candidate "${{ steps.release-package.outputs.candidate_sha }}" \
            '{
              schemaVersion: 1,
              candidateRevision: $candidate,
              evidenceLevel: "hosted-readiness",
              completionClaimed: false,
              reports: map({gate, result, blockers, externalEvidenceRemaining})
            }' "$evidence_dir"/gate-*.json > "$evidence_dir/index.json"
          echo "### Hosted Gates 10-16 readiness" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.reports[] | "- Gate \(.gate): \(.result); completion claimed: false"' \
            "$evidence_dir/index.json" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

      - name: Upload sanitized Gates 10-16 readiness evidence
        if: always() && steps.hosted-gates10-16.outputs.requested == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-gates10-16-readiness-${{ steps.release-package.outputs.candidate_sha }}
          path: ${{ steps.hosted-gates10-16.outputs.directory }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce requested Gates 10-16 readiness
        if: always() && steps.hosted-gates10-16.outputs.requested == 'true'
        env:
          READINESS_OUTCOME: ${{ steps.hosted-gates10-16.outcome }}
        run: |
          if [[ "$READINESS_OUTCOME" != "success" ]]; then
            echo "::error::At least one requested Gate 10-16 readiness probe is blocked. Inspect the sanitized artifact."
            exit 1
          fi

      - name: Remove temporary Worker secret bundle
        if: always() && steps.worker-secrets.outputs.path != ''
        shell: bash
        run: rm -f "${{ steps.worker-secrets.outputs.path }}"

      - name: Upload sanitized staging runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-runtime-evidence
          path: |
            ${{ runner.temp }}/vinifera-staging-runtime.json
            ${{ runner.temp }}/vinifera-staging-release.json
            ${{ runner.temp }}/stripe-test-catalog-verification.json
            ${{ runner.temp }}/vinifera-hosted-gate7-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
