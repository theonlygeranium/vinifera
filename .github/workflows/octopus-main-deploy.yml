name: Octopus Deploy — Main to Development

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Only trigger on meaningful changes — skip docs and workflow-only changes
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - ".octopus/**"
      - "tests/**"
      - "public/_redirects"
      - "public/vinifera-promotion-smoke-*.html"

jobs:
  create-and-deploy:
    name: Create Release and Deploy to Development
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write
      id-token: write   # Required for OIDC token exchange with Octopus

    env:
      CF_ACCESS_PROXY_PORT: "41809"
      OCTOPUS_PROXY_URL: http://127.0.0.1:41809

    steps:
      - name: Require main ref for Octopus deployment
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Octopus main deployment must run from refs/heads/main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start Cloudflare Access proxy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.OCTOPUS_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.OCTOPUS_CF_ACCESS_CLIENT_SECRET }}
          OCTOPUS_TARGET_URL: ${{ secrets.OCTOPUS_URL }}
        run: |
          set -euo pipefail
          node .github/scripts/cloudflare-access-proxy.mjs > "$RUNNER_TEMP/octopus-cf-access-proxy.log" 2>&1 &
          echo "OCTOPUS_CF_ACCESS_PROXY_PID=$!" >> "$GITHUB_ENV"

          # Health-check /api — public endpoint, no API key required
          for _ in {1..20}; do
            if curl -fsS "${OCTOPUS_PROXY_URL}/api" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/octopus-cf-access-proxy.log"
          exit 1

      - name: Login to Octopus Deploy (OIDC) 🔑
        id: octopus_login
        uses: OctopusDeploy/login@v1
        with:
          server: ${{ env.OCTOPUS_PROXY_URL }}
          service_account_id: ${{ secrets.OCTOPUS_SERVICE_ACCOUNT_ID }}

      - name: Push Build Information 📦
        uses: OctopusDeploy/push-build-information-action@v4
        env:
          OCTOPUS_ACCESS_TOKEN: ${{ steps.octopus_login.outputs.access_token }}
          OCTOPUS_URL: ${{ env.OCTOPUS_PROXY_URL }}
          OCTOPUS_SPACE: Default
        with:
          packages: |
            Vinifera
          version: 0.0.${{ github.run_number }}-${{ github.run_attempt }}
          overwrite_mode: OverwriteExisting

      - name: Create Octopus Release 🚀
        uses: OctopusDeploy/create-release-action@v4
        id: create_release
        env:
          OCTOPUS_ACCESS_TOKEN: ${{ steps.octopus_login.outputs.access_token }}
          OCTOPUS_URL: ${{ env.OCTOPUS_PROXY_URL }}
          OCTOPUS_SPACE: Default
        with:
          project: Vinifera
          release_number: "0.0.${{ github.run_number }}-${{ github.run_attempt }}"
          git_ref: ${{ github.ref }}
          git_commit: ${{ github.sha }}

      - name: Deploy to Development 🏗️
        uses: OctopusDeploy/deploy-release-action@v4
        env:
          GH_PAT_FOR_OCTOPUS: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          OCTOPUS_ACCESS_TOKEN: ${{ steps.octopus_login.outputs.access_token }}
          OCTOPUS_URL: ${{ env.OCTOPUS_PROXY_URL }}
          OCTOPUS_SPACE: Default
        with:
          project: Vinifera
          release_number: ${{ steps.create_release.outputs.release_number }}
          environments: |
            Development
          variables: |
            GitHubPAT:${{ secrets.GH_PAT_FOR_OCTOPUS }}
            PRBranch:${{ github.ref_name }}
            PRNumber:${{ github.run_number }}
            ExpectedBaseRef:${{ github.ref_name }}
            ExpectedBaseSHA:${{ github.sha }}
            ExpectedHeadSHA:${{ github.sha }}
          # Development deploys are automatic — no manual intervention required.
          # Staging and Production require manual approval in Octopus.

      - name: Stop Cloudflare Access proxy
        if: always()
        run: |
          if [[ -n "${OCTOPUS_CF_ACCESS_PROXY_PID:-}" ]]; then
            kill "$OCTOPUS_CF_ACCESS_PROXY_PID" 2>/dev/null || true
          fi
