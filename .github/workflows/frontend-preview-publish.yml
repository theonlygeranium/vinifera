name: Trusted frontend preview publication

on:
  workflow_run:
    workflows: ["Development fast validation"]
    types: [completed]

concurrency:
  group: vinifera-preview-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Isolated preview policy validation
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      applicable: ${{ steps.validate.outputs.applicable }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
      head_ref: ${{ steps.validate.outputs.head_ref }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      publish_status: ${{ steps.validate.outputs.publish_status }}
    steps:
      - name: Check out isolated default-branch validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download unprivileged candidate artifact
        id: download
        if: github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-preview-candidate
          path: ${{ runner.temp }}/frontend-preview-candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate artifact against live pull request
        id: validate
        continue-on-error: true
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_CONCLUSION" != "success" ]]; then
            echo "::notice::Development fast validation did not succeed; preview publication is not applicable."
            printf 'publish_status=false\nhead_sha=%s\n' "$WORKFLOW_HEAD_SHA" >> "$GITHUB_OUTPUT"
            {
              echo "## Frontend preview evidence"
              echo
              echo "- Policy: \`upstream_dev_validation_$WORKFLOW_CONCLUSION\`"
              echo "- Exact head: \`$WORKFLOW_HEAD_SHA\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$DOWNLOAD_OUTCOME" != "success" ]]; then
            echo "::error::The exact candidate artifact is unavailable."
            exit 1
          fi

          candidate="$RUNNER_TEMP/frontend-preview-candidate"
          metadata="$candidate/metadata.json"
          if [[ ! -f "$metadata" ]] || find "$candidate" -type l -print -quit | grep -q .; then
            echo "::error::Preview candidate metadata is missing or contains a symlink."
            exit 1
          fi
          jq -e '
            type == "object" and
            (.applicable | type == "boolean") and
            (.candidate_eligible | type == "boolean") and
            (.draft | type == "boolean") and
            (.pr_number | type == "number") and
            (.pr_number > 0) and
            (.base_sha | test("^[0-9a-f]{40}$")) and
            (.head_sha | test("^[0-9a-f]{40}$")) and
            (.head_ref | test("^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$")) and
            (.head_repository | type == "string") and
            (.repository | type == "string")
          ' "$metadata" >/dev/null

          pr_number=$(jq -r '.pr_number' "$metadata")
          head_sha=$(jq -r '.head_sha' "$metadata")
          base_sha=$(jq -r '.base_sha' "$metadata")
          head_ref=$(jq -r '.head_ref' "$metadata")
          applicable=$(jq -r '.applicable' "$metadata")
          candidate_eligible=$(jq -r '.candidate_eligible' "$metadata")
          draft=$(jq -r '.draft' "$metadata")
          head_repository=$(jq -r '.head_repository' "$metadata")
          artifact_repository=$(jq -r '.repository' "$metadata")

          git check-ref-format --branch "$head_ref" >/dev/null
          if [[ "$artifact_repository" != "$REPOSITORY" \
            || "$head_repository" != "$REPOSITORY" \
            || "$head_sha" != "$WORKFLOW_HEAD_SHA" ]]; then
            echo "::error::Candidate repository or workflow head does not match."
            exit 1
          fi

          pr=$(gh api "repos/$REPOSITORY/pulls/$pr_number")
          if [[ "$(jq -r '.state' <<<"$pr")" != "open" ]]; then
            echo "::notice::Pull request closed before preview publication; preview publication is not applicable."
            printf 'publish_status=false\nhead_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(jq -r '.state' <<<"$pr")" != "open" \
            || "$(jq -r '.base.ref' <<<"$pr")" != "dev" \
            || "$(jq -r '.base.sha' <<<"$pr")" != "$base_sha" \
            || "$(jq -r '.head.sha' <<<"$pr")" != "$head_sha" \
            || "$(jq -r '.head.ref' <<<"$pr")" != "$head_ref" \
            || "$(jq -r '.head.repo.full_name' <<<"$pr")" != "$REPOSITORY" \
            || "$(jq -r '.draft' <<<"$pr")" != "$draft" ]]; then
            echo "::error::Live pull-request identity differs from the candidate artifact."
            exit 1
          fi
          if [[ "$head_ref" == "main" || "$head_ref" == "staging" || "$head_ref" == "dev" ]]; then
            echo "::notice::Protected environment branches do not receive frontend preview deployments."
            printf 'publish_status=true\napplicable=false\nbase_sha=%s\nhead_ref=%s\nhead_sha=%s\npr_number=%s\n' \
              "$base_sha" "$head_ref" "$head_sha" "$pr_number" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$head_sha^{commit}"
          trusted_policy="$RUNNER_TEMP/trusted-delivery-policy.mjs"
          git show "$base_sha":.github/scripts/delivery-policy.mjs \
            > "$trusted_policy"
          mkdir -p "$RUNNER_TEMP/policy-home"
          trusted_applicable=$(env -i \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP/policy-home" \
            BASE_SHA="$base_sha" \
            HEAD_SHA="$head_sha" \
            TRUSTED_POLICY_PATH="$trusted_policy" \
            node --input-type=module <<'NODE'
          import { pathToFileURL } from "node:url";
          const {
            classifyDeliveryChange,
            readChangedRecords,
          } = await import(pathToFileURL(process.env.TRUSTED_POLICY_PATH).href);
          const result = classifyDeliveryChange(
            readChangedRecords(process.env.BASE_SHA, process.env.HEAD_SHA),
          );
          if (!result.classificationSucceeded) {
            throw new Error(`Trusted preview classification failed: ${result.reason}`);
          }
          process.stdout.write(String(result.previewRequired));
          NODE
          )
          if [[ ! "$trusted_applicable" =~ ^(true|false)$ ]]; then
            echo "::error::Isolated preview policy returned an invalid result."
            exit 1
          fi
          if [[ "$applicable" != "$trusted_applicable" ]]; then
            echo "::error::Artifact preview applicability differs from trusted live-diff policy."
            exit 1
          fi
          if [[ "$candidate_eligible" != "true" && "$trusted_applicable" == "true" ]]; then
            echo "::error::A non-candidate cannot require a preview."
            exit 1
          fi
          if [[ "$trusted_applicable" == "true" && ! -d "$candidate/dist" ]]; then
            echo "::error::Applicable preview assets are missing."
            exit 1
          fi

          printf 'publish_status=true\napplicable=%s\nbase_sha=%s\nhead_ref=%s\nhead_sha=%s\npr_number=%s\n' \
            "$trusted_applicable" "$base_sha" "$head_ref" "$head_sha" "$pr_number" \
            >> "$GITHUB_OUTPUT"

  publish:
    name: Frontend preview evidence
    needs: validate
    if: always() && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - name: Fresh trusted default-branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      - name: Download exact candidate artifact again
        id: download
        if: needs.validate.result == 'success' && needs.validate.outputs.publish_status != 'false'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-preview-candidate
          path: ${{ runner.temp }}/frontend-preview-candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Revalidate exact identity without base code execution
        id: revalidate
        continue-on-error: true
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_STATUS: ${{ needs.validate.outputs.publish_status }}
          EXPECTED_APPLICABLE: ${{ needs.validate.outputs.applicable }}
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          EXPECTED_HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          EXPECTED_PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_STATUS" == "false" ]]; then
            echo "::notice::Preview publication is not applicable."
            printf 'publish_status=false\nhead_sha=%s\n' "$WORKFLOW_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$VALIDATE_RESULT" != "success" || "$DOWNLOAD_OUTCOME" != "success" ]]; then
            echo "::error::Isolated validation or exact artifact download failed."
            exit 1
          fi

          candidate="$RUNNER_TEMP/frontend-preview-candidate"
          metadata="$candidate/metadata.json"
          if [[ ! -f "$metadata" ]] || find "$candidate" -type l -print -quit | grep -q .; then
            echo "::error::Preview candidate metadata is missing or contains a symlink."
            exit 1
          fi
          jq -e '
            type == "object" and
            (.applicable | type == "boolean") and
            (.candidate_eligible | type == "boolean") and
            (.draft | type == "boolean") and
            (.pr_number | type == "number") and
            (.pr_number > 0) and
            (.base_sha | test("^[0-9a-f]{40}$")) and
            (.head_sha | test("^[0-9a-f]{40}$")) and
            (.head_ref | test("^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$")) and
            (.head_repository | type == "string") and
            (.repository | type == "string")
          ' "$metadata" >/dev/null

          pr_number=$(jq -r '.pr_number' "$metadata")
          head_sha=$(jq -r '.head_sha' "$metadata")
          base_sha=$(jq -r '.base_sha' "$metadata")
          head_ref=$(jq -r '.head_ref' "$metadata")
          applicable=$(jq -r '.applicable' "$metadata")
          candidate_eligible=$(jq -r '.candidate_eligible' "$metadata")
          draft=$(jq -r '.draft' "$metadata")
          head_repository=$(jq -r '.head_repository' "$metadata")
          artifact_repository=$(jq -r '.repository' "$metadata")
          if [[ "$artifact_repository" != "$REPOSITORY" \
            || "$head_repository" != "$REPOSITORY" \
            || "$pr_number" != "$EXPECTED_PR_NUMBER" \
            || "$head_sha" != "$EXPECTED_HEAD_SHA" \
            || "$head_sha" != "$WORKFLOW_HEAD_SHA" \
            || "$base_sha" != "$EXPECTED_BASE_SHA" \
            || "$head_ref" != "$EXPECTED_HEAD_REF" \
            || "$applicable" != "$EXPECTED_APPLICABLE" ]]; then
            echo "::error::Privileged publication identity differs from isolated validation."
            exit 1
          fi

          pr=$(gh api "repos/$REPOSITORY/pulls/$pr_number")
          if [[ "$(jq -r '.state' <<<"$pr")" != "open" \
            || "$(jq -r '.base.ref' <<<"$pr")" != "dev" \
            || "$(jq -r '.base.sha' <<<"$pr")" != "$base_sha" \
            || "$(jq -r '.head.sha' <<<"$pr")" != "$head_sha" \
            || "$(jq -r '.head.ref' <<<"$pr")" != "$head_ref" \
            || "$(jq -r '.head.repo.full_name' <<<"$pr")" != "$REPOSITORY" \
            || "$(jq -r '.draft' <<<"$pr")" != "$draft" ]]; then
            echo "::error::Pull-request identity changed before privileged publication."
            exit 1
          fi
          if [[ "$candidate_eligible" != "true" && "$applicable" == "true" ]]; then
            echo "::error::A non-candidate cannot require privileged publication."
            exit 1
          fi
          if [[ "$applicable" == "true" && ! -d "$candidate/dist" ]]; then
            echo "::error::Applicable preview assets are missing."
            exit 1
          fi
          printf 'publish_status=true\napplicable=%s\nbase_sha=%s\nhead_ref=%s\nhead_sha=%s\npr_number=%s\n' \
            "$applicable" "$base_sha" "$head_ref" "$head_sha" "$pr_number" \
            >> "$GITHUB_OUTPUT"

      - name: Install trusted Wrangler toolchain
        if: steps.revalidate.outcome == 'success' && steps.revalidate.outputs.applicable == 'true'
        run: npm ci

      - name: Publish exact frontend assets to Cloudflare Pages
        id: deploy
        if: steps.revalidate.outcome == 'success' && steps.revalidate.outputs.applicable == 'true'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HEAD_REF: ${{ steps.revalidate.outputs.head_ref }}
          HEAD_SHA: ${{ steps.revalidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/frontend-preview-deploy.log"
          ./node_modules/.bin/wrangler pages deploy \
            "$RUNNER_TEMP/frontend-preview-candidate/dist" \
            --project-name vinifera-dev \
            --branch "$HEAD_REF" \
            --commit-hash "$HEAD_SHA" \
            --commit-dirty=false \
            | tee "$deploy_log"
          immutable_url=$(grep -Eo 'https://[a-z0-9-]+\.vinifera-dev\.pages\.dev' "$deploy_log" \
            | tail -1)
          if [[ -z "$immutable_url" ]]; then
            echo "::error::Wrangler did not report an immutable Pages deployment URL."
            exit 1
          fi
          branch_slug=$(tr '[:upper:]' '[:lower:]' <<<"$HEAD_REF" \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          branch_url="https://${branch_slug}.vinifera-dev.pages.dev"
          printf 'branch_url=%s\nimmutable_url=%s\n' "$branch_url" "$immutable_url" \
            >> "$GITHUB_OUTPUT"

      - name: Publish exact-head preview status
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATE_OUTCOME: ${{ steps.revalidate.outcome }}
          APPLICABLE: ${{ steps.revalidate.outputs.applicable }}
          BASE_SHA: ${{ steps.revalidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revalidate.outputs.head_sha || github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.revalidate.outputs.pr_number }}
          BRANCH_URL: ${{ steps.deploy.outputs.branch_url }}
          IMMUTABLE_URL: ${{ steps.deploy.outputs.immutable_url }}
          PUBLISH_STATUS: ${{ steps.revalidate.outputs.publish_status }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_STATUS" == "false" ]]; then
            echo "::notice::Preview status publication skipped for non-success upstream validation."
            exit 0
          fi
          state=failure
          description="Preview evidence failed closed"
          if [[ "$VALIDATE_OUTCOME" == "success" && "$APPLICABLE" != "true" ]]; then
            state=success
            description="Preview not applicable PR #$PR_NUMBER dev@${BASE_SHA:0:12}"
          elif [[ "$VALIDATE_OUTCOME" == "success" && "$DEPLOY_OUTCOME" == "success" ]]; then
            state=success
            description="Preview published PR #$PR_NUMBER dev@${BASE_SHA:0:12}"
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="Frontend preview evidence" \
            -f description="$description" \
            -f target_url="$RUN_URL"
          {
            echo "## Frontend preview evidence"
            echo
            echo "- Exact head: \`$HEAD_SHA\`"
            echo "- Policy: \`$description\`"
            if [[ -n "$BRANCH_URL" ]]; then
              echo "- Branch alias: [$BRANCH_URL]($BRANCH_URL)"
            fi
            if [[ -n "$IMMUTABLE_URL" ]]; then
              echo "- Immutable deployment: [$IMMUTABLE_URL]($IMMUTABLE_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$state" != "success" ]]; then
            exit 1
          fi

      - name: Wake trusted development auto-merge
        if: steps.revalidate.outputs.publish_status != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.revalidate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.revalidate.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ \
            || ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Successful preview evidence lacks exact dispatch identity."
            exit 1
          fi
          jq -n \
            --arg event_type frontend_preview_evidence \
            --arg head_sha "$HEAD_SHA" \
            --argjson pr_number "$PR_NUMBER" \
            '{
              event_type: $event_type,
              client_payload: {
                head_sha: $head_sha,
                pr_number: $pr_number
              }
            }' | gh api \
              --method POST \
              "repos/$REPOSITORY/dispatches" \
              --input -
