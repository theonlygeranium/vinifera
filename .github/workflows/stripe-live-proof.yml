name: Stripe Gate 19 live charge and refund proof

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare hosted Checkout or finalize one paid charge/refund proof
        required: true
        type: choice
        options:
          - prepare
          - finalize
      git_sha:
        description: Exact authorized main release (current for prepare; original prepare release for finalize)
        required: true
        type: string
      proof_nonce:
        description: One UUID shared by prepare and finalize
        required: true
        type: string
      checkout_session_id:
        description: cs_live_ Session from prepare (required only for finalize)
        required: false
        type: string
      confirmation:
        description: Exact owner confirmation from the reviewed Gate 19 policy
        required: true
        type: string
      request_binding_reversion:
        description: Record that the separate live-billing cutover should be reverted after proof
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vinifera-stripe-gate19-live-proof
  cancel-in-progress: false

jobs:
  proof:
    name: ${{ inputs.operation }} Gate 19 live proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRODUCTION_STRIPE_LIVE_PROOF_BRAND_ID: ${{ vars.PRODUCTION_STRIPE_LIVE_PROOF_BRAND_ID }}
      PRODUCTION_STRIPE_LIVE_PROOF_CUSTOMER_ID: ${{ vars.PRODUCTION_STRIPE_LIVE_PROOF_CUSTOMER_ID }}
      PRODUCTION_STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE_BASE64: ${{ secrets.PRODUCTION_STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE_BASE64 }}
      PRODUCTION_STRIPE_LIVE_PROOF_MAX_AMOUNT_CENTS: ${{ vars.PRODUCTION_STRIPE_LIVE_PROOF_MAX_AMOUNT_CENTS }}
      PRODUCTION_STRIPE_LIVE_PROOF_ORGANIZATION_ID: ${{ vars.PRODUCTION_STRIPE_LIVE_PROOF_ORGANIZATION_ID }}
      PRODUCTION_STRIPE_LIVE_PROOF_PLAN: ${{ vars.PRODUCTION_STRIPE_LIVE_PROOF_PLAN }}
      PRODUCTION_STRIPE_LIVE_PROOF_PRICE_ID: ${{ vars.PRODUCTION_STRIPE_LIVE_PROOF_PRICE_ID }}
      PRODUCTION_STRIPE_LIVE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_LIVE_SECRET_KEY }}
      PRODUCTION_STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_LIVE_WEBHOOK_SECRET }}
      PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_WORKER_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
      STRIPE_LIVE_PROOF_CONFIRMATION: ${{ inputs.confirmation }}
      STRIPE_LIVE_PROOF_GIT_SHA: ${{ inputs.git_sha }}
      STRIPE_LIVE_PROOF_NONCE: ${{ inputs.proof_nonce }}
      STRIPE_LIVE_PROOF_REQUEST_BINDING_REVERSION: ${{ inputs.request_binding_reversion }}
      STRIPE_LIVE_PROOF_SESSION_ID: ${{ inputs.checkout_session_id }}

    steps:
      - name: Validate immutable main-only dispatch shape
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "theonlygeranium/vinifera" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$STRIPE_LIVE_PROOF_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STRIPE_LIVE_PROOF_NONCE" =~ ^[0-9a-fA-F-]{36}$ ]]
          if [[ "${{ inputs.operation }}" == "prepare" ]]; then
            [[ -z "$STRIPE_LIVE_PROOF_SESSION_ID" ]]
          else
            [[ "$STRIPE_LIVE_PROOF_SESSION_ID" =~ ^cs_live_[A-Za-z0-9]+$ ]]
          fi

      - name: Check out immutable trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.git_sha }}

      - name: Revalidate current main and reviewed production release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$STRIPE_LIVE_PROOF_GIT_SHA" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "${{ inputs.operation }}" == "prepare" ]]; then
            [[ "$(git rev-parse origin/main)" == "$STRIPE_LIVE_PROOF_GIT_SHA" ]]
          else
            git merge-base --is-ancestor \
              "$STRIPE_LIVE_PROOF_GIT_SHA" refs/remotes/origin/main
          fi
          authorization_prs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$STRIPE_LIVE_PROOF_GIT_SHA/pulls")
          authorization_pr=$(jq -c \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_sha "$STRIPE_LIVE_PROOF_GIT_SHA" \
            '[.[] |
              select(.merged_at != null) |
              select(.base.ref == "main") |
              select(.head.ref == "staging") |
              select(.merge_commit_sha == $release_sha) |
              select(.head.repo.full_name == $repository)] |
             sort_by(.merged_at) | last // empty' <<<"$authorization_prs")
          [[ -n "$authorization_pr" ]]
          if jq -e \
            'any(.labels[]?; .name == "human-review-required" or .name == "do-not-merge")' \
            <<<"$authorization_pr" >/dev/null; then
            echo "The production release is paused by an emergency control." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
          node-version: 22.22.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the dedicated Gate 19 controller
        run: npm run qa:stripe-live-proof

      - name: Initialize private handoff and sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/stripe-gate19-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence_dir"
          {
            echo "STRIPE_LIVE_PROOF_EVIDENCE_DIR=$evidence_dir"
            echo "STRIPE_LIVE_PROOF_HANDOFF=$RUNNER_TEMP/stripe-gate19-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            echo "STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE=$RUNNER_TEMP/stripe-gate19-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.pem"
          } >> "$GITHUB_ENV"

      - name: Validate the owner-only handoff recipient
        if: inputs.operation == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRODUCTION_STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE_BASE64" ]]
          printf '%s' "$PRODUCTION_STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE_BASE64" |
            base64 --decode > "$STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE"
          openssl x509 \
            -in "$STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE" \
            -noout \
            -checkend 3600

      - name: Prepare exactly one hosted live Checkout handoff
        if: inputs.operation == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stripe-live-proof.mjs prepare \
            --report "$STRIPE_LIVE_PROOF_EVIDENCE_DIR/report.json" \
            --handoff "$STRIPE_LIVE_PROOF_HANDOFF"
          checkout_url=$(jq -er '.checkoutUrl' "$STRIPE_LIVE_PROOF_HANDOFF")
          session_id=$(jq -er '.sessionId' "$STRIPE_LIVE_PROOF_HANDOFF")
          [[ "$checkout_url" == https://checkout.stripe.com/* ]]
          [[ "$session_id" =~ ^cs_live_[A-Za-z0-9]+$ ]]
          openssl cms \
            -encrypt \
            -binary \
            -aes-256-cbc \
            -in "$STRIPE_LIVE_PROOF_HANDOFF" \
            -outform DER \
            -out "$STRIPE_LIVE_PROOF_EVIDENCE_DIR/owner-handoff.p7m" \
            "$STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE"
          [[ -s "$STRIPE_LIVE_PROOF_EVIDENCE_DIR/owner-handoff.p7m" ]]
          {
            echo "## Gate 19 hosted-payment handoff"
            echo
            echo "Download the retained artifact and decrypt \`owner-handoff.p7m\` with the owner-held private key. The decrypted private handoff contains the Stripe-hosted Checkout URL and Session ID."
            echo "No Checkout capability, Session ID, proof nonce, or card data is written to this summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify one charge, replay signed webhooks, refund once, and clean up
        if: inputs.operation == 'finalize'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stripe-live-proof.mjs finalize \
            --report "$STRIPE_LIVE_PROOF_EVIDENCE_DIR/report.json" \
            --session-id "$STRIPE_LIVE_PROOF_SESSION_ID"
          jq -e \
            '.verified == true and .chargeCount == 1 and .refundCount == 1 and
             .financialMutationCount == 2 and .signedWebhookReplayCount == 4 and
             .activeApplicationProven == true and .chargeFullyRefunded == true and
             .refundState == "succeeded" and .finalApplicationState == "canceled" and
             .finalSubscriptionState == "canceled"' \
            "$STRIPE_LIVE_PROOF_EVIDENCE_DIR/report.json" >/dev/null
          {
            echo "## Gate 19 live proof complete"
            echo
            echo "- Exactly one live charge: verified"
            echo "- Exactly one full refund: verified"
            echo "- Signed subscription webhook idempotency: verified"
            echo "- Application active then canceled lifecycle: verified"
            echo "- Subscription renewal cleanup: verified"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.request_binding_reversion }}" == "true" ]]; then
            {
              echo
              echo "Binding reversion was requested. Dispatch the separate protected \`Stripe live billing cutover\` workflow with its reviewed \`revert\` confirmation; this proof workflow does not mutate Worker bindings."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove private hosted-payment handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${STRIPE_LIVE_PROOF_HANDOFF:-}" &&
                "$STRIPE_LIVE_PROOF_HANDOFF" == "$RUNNER_TEMP"/stripe-gate19-handoff-* ]]; then
            rm -f -- "$STRIPE_LIVE_PROOF_HANDOFF"
          fi
          if [[ -n "${STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE:-}" &&
                "$STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE" == "$RUNNER_TEMP"/stripe-gate19-owner-* ]]; then
            rm -f -- "$STRIPE_LIVE_PROOF_HANDOFF_CERTIFICATE"
          fi

      - name: Upload sanitized Gate 19 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: stripe-gate19-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stripe-gate19-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
