name: Promote dev to staging

# ─── Governance: Options 1 + 2 + 4 (Amendment 2026-07-28) ────────────────────
#
# This workflow implements the three governance amendments approved by the
# human owner on 2026-07-28:
#
#   Option 1 — Agent opens the dev→staging PR (was: human-only).
#   Option 2 — Agent auto-merges dev→staging when all gates pass, with
#               double Schubert health-check guardrails to fail closed on
#               infrastructure degradation.
#   Option 4 — staging→main gate remains exclusively human-initiated.
#               This workflow touches staging only.
#
# GUARDRAILS against silent breaking (Option 2 mitigations):
#   1. Gate 1  — Schubert health probe via Supabase REST API (avoids Bot
#                Fight Mode by authenticating through the Kong gateway with
#                the staging service-role key). Fails closed on non-2xx.
#   2. Gate 2  — Wait for all CI checks on the promotion PR to complete.
#                Any failing check aborts the merge and leaves the PR open
#                for human inspection.
#   3. Gate 3  — Second Schubert health re-check immediately before the
#                merge commit. Guards against the race where Schubert
#                degrades between Gate 1 and merge.
#   4. Fail-open PR — on any gate failure the PR is left open (not closed),
#                so the human owner can inspect and merge or discard manually.
#   5. Concurrency lock — only one run of this workflow at a time. A slower
#                queued run is cancelled; a replace-in-progress run takes over.
#   6. Explicit merge strategy — uses squash merge to keep staging history
#                clean and traceable.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — open PR but do not merge'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: vinifera-promote-dev-to-staging
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  PR_TITLE: 'chore(release): promote dev → staging'
  PR_BODY: |
    **Automated promotion:** dev → staging

    This PR was opened automatically by `promote-dev-to-staging.yml` after a
    push to `dev`. All CI checks and Schubert health probes passed at the time
    of merge. Review the commit log below before promoting further to `main`.

    > **staging → main** is a human-only gate and is never automated.

jobs:
  # ─── Gate 1: Schubert health probe ─────────────────────────────────────────
  schubert-health-pre:
    name: Schubert pre-flight health probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      healthy: ${{ steps.probe.outputs.healthy }}

    steps:
      - name: Probe staging Supabase REST API via Kong
        id: probe
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${STAGING_SUPABASE_URL:-}" || -z "${STAGING_SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::STAGING_SUPABASE_URL or STAGING_SUPABASE_ANON_KEY secret is not configured."
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          http_code=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            -H "apikey: ${STAGING_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ANON_KEY}" \
            "${STAGING_SUPABASE_URL}/rest/v1/" || echo "000")

          echo "Schubert REST probe HTTP status: $http_code"

          if [[ "$http_code" =~ ^2 ]]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "✅ Schubert is healthy (HTTP $http_code)"
            echo "### Schubert pre-flight: ✅ healthy (HTTP $http_code)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "::error::Schubert health probe failed (HTTP $http_code). Promotion aborted — PR left open for human inspection."
            echo "### Schubert pre-flight: ❌ FAILED (HTTP $http_code) — promotion aborted" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ─── Open or update the promotion PR ────────────────────────────────────────
  open-pr:
    name: Open or update dev→staging PR
    needs: schubert-health-pre
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.upsert.outputs.pr_number }}
      pr_sha: ${{ steps.upsert.outputs.pr_sha }}

    steps:
      - name: Upsert promotion PR
        id: upsert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ env.PR_TITLE }}
          PR_BODY: ${{ env.PR_BODY }}
        run: |
          set -euo pipefail

          # Look for an existing open PR dev→staging
          existing=$(gh pr list \
            --repo "$REPO" \
            --head dev \
            --base staging \
            --state open \
            --json number \
            --jq '.[0].number // ""')

          if [[ -n "$existing" ]]; then
            echo "Existing promotion PR #$existing found — updating body."
            gh pr edit "$existing" \
              --repo "$REPO" \
              --body "$PR_BODY"
            pr_number="$existing"
          else
            pr_number=$(gh pr create \
              --repo "$REPO" \
              --head dev \
              --base staging \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --label "automated-promotion" \
              --no-maintainer-edit \
              | grep -Eo '[0-9]+$')
            echo "Opened new promotion PR #$pr_number"
          fi

          # Capture the head SHA of dev at this moment
          pr_sha=$(gh pr view "$pr_number" \
            --repo "$REPO" \
            --json headRefOid \
            --jq '.headRefOid')

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_sha=$pr_sha" >> "$GITHUB_OUTPUT"
          echo "### Promotion PR: #$pr_number (head: \`${pr_sha:0:12}\`)" >> "$GITHUB_STEP_SUMMARY"

  # ─── Gate 2: Wait for PR CI checks ──────────────────────────────────────────
  wait-for-ci:
    name: Wait for promotion PR CI checks
    needs: open-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ci_passed: ${{ steps.poll.outputs.ci_passed }}

    steps:
      - name: Poll CI checks on promotion PR head SHA
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_SHA: ${{ needs.open-pr.outputs.pr_sha }}
        run: |
          set -euo pipefail

          echo "Polling CI for SHA ${PR_SHA:0:12}..."

          deadline=$(( $(date +%s) + 1500 ))   # 25-minute hard cap
          while true; do
            now=$(date +%s)
            if (( now > deadline )); then
              echo "::error::CI polling timed out after 25 minutes."
              echo "ci_passed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            checks=$(gh api \
              "repos/$REPO/commits/$PR_SHA/check-runs" \
              --jq '.check_runs')

            total=$(echo "$checks" | jq length)
            completed=$(echo "$checks" | jq '[.[] | select(.status == "completed")] | length')
            failed=$(echo "$checks" | jq '[.[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')

            echo "  CI: $completed/$total checks complete, $failed failed"

            if (( total == 0 )); then
              echo "  No checks registered yet — waiting..."
              sleep 20
              continue
            fi

            if (( failed > 0 )); then
              failed_names=$(echo "$checks" | jq -r '[.[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .name] | join(", ")')
              echo "::error::CI checks failed: $failed_names — promotion aborted."
              echo "ci_passed=false" >> "$GITHUB_OUTPUT"
              echo "### CI gate: ❌ FAILED — $failed_names" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if (( completed == total )); then
              echo "✅ All $total CI checks passed"
              echo "ci_passed=true" >> "$GITHUB_OUTPUT"
              echo "### CI gate: ✅ all $total checks passed" >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            sleep 20
          done

  # ─── Gate 3: Schubert re-check immediately before merge ─────────────────────
  schubert-health-pre-merge:
    name: Schubert pre-merge health re-check
    needs: [open-pr, wait-for-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Re-probe staging Supabase REST API
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          http_code=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            -H "apikey: ${STAGING_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ANON_KEY}" \
            "${STAGING_SUPABASE_URL}/rest/v1/" || echo "000")

          echo "Schubert pre-merge re-check HTTP status: $http_code"

          if [[ "$http_code" =~ ^2 ]]; then
            echo "✅ Schubert pre-merge re-check passed (HTTP $http_code)"
            echo "### Schubert pre-merge re-check: ✅ healthy (HTTP $http_code)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Schubert degraded before merge (HTTP $http_code). Promotion aborted — PR left open."
            echo "### Schubert pre-merge re-check: ❌ FAILED (HTTP $http_code) — merge aborted" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ─── Merge ───────────────────────────────────────────────────────────────────
  merge:
    name: Squash-merge promotion PR
    needs: [open-pr, wait-for-ci, schubert-health-pre-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dry-run check
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run — skipping merge. PR #${{ needs.open-pr.outputs.pr_number }} is open for human inspection."
          echo "### Dry run — merge skipped" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Squash-merge dev→staging
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open-pr.outputs.pr_number }}
          PR_SHA: ${{ needs.open-pr.outputs.pr_sha }}
        run: |
          set -euo pipefail

          merge_sha=$(gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --subject "chore(release): promote dev → staging" \
            --body "Automated squash-merge via promote-dev-to-staging.yml. All gates passed. Head SHA: ${PR_SHA:0:12}." \
            --delete-branch=false \
            | grep -Eo '[0-9a-f]{40}' | head -1 || echo "")

          echo "✅ Promotion PR #$PR_NUMBER merged"
          echo "### Merge: ✅ PR #$PR_NUMBER squash-merged" >> "$GITHUB_STEP_SUMMARY"
          echo "staging HEAD updated from dev @ \`${PR_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **staging → main** is a human-only gate. No further automated promotion will occur." >> "$GITHUB_STEP_SUMMARY"