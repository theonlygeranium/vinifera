name: Promote dev to staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — open PR and evaluate gates without merging"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: vinifera-promote-dev-to-staging
  cancel-in-progress: true

permissions: {}

env:
  PR_TITLE: "chore(release): promote dev → staging"
  PR_BODY: |
    **Automated promotion:** dev → staging

    This PR was opened automatically after a push to `dev`. Automation will
    merge it only if the staging Supabase REST probes, required CI and review
    checks, and unresolved-thread gate all pass for the captured head commit.

    > **staging → main** is a human-only gate and is never automated.

jobs:
  open-pr:
    name: Open or update dev→staging PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_created_at: ${{ steps.upsert.outputs.pr_created_at }}
      pr_number: ${{ steps.upsert.outputs.pr_number }}
      pr_sha: ${{ steps.upsert.outputs.pr_sha }}

    steps:
      - name: Upsert promotion PR using an event-producing token
        id: upsert
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ env.PR_TITLE }}
          PR_BODY: ${{ env.PR_BODY }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GH_PAT_FOR_OCTOPUS is required to open the PR and trigger pull_request CI."
            exit 1
          fi

          existing=$(gh pr list \
            --repo "$REPO" \
            --head dev \
            --base staging \
            --state open \
            --json number \
            --jq '.[0].number // ""')

          if [[ -n "$existing" ]]; then
            echo "Existing promotion PR #$existing found — updating body."
            gh pr edit "$existing" --repo "$REPO" --body "$PR_BODY"
            pr_number="$existing"
          else
            pr_url=$(gh pr create \
              --repo "$REPO" \
              --head dev \
              --base staging \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --no-maintainer-edit)
            pr_number="${pr_url##*/}"
            if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not resolve the created promotion PR number."
              exit 1
            fi
            echo "Opened new promotion PR #$pr_number"
          fi

          pr_metadata=$(gh pr view "$pr_number" \
            --repo "$REPO" \
            --json createdAt,headRefOid)
          pr_sha=$(jq -r '.headRefOid' <<<"$pr_metadata")
          pr_created_at=$(jq -r '.createdAt' <<<"$pr_metadata")
          if [[ ! "$pr_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Promotion PR head is not an exact commit SHA."
            exit 1
          fi
          if [[ ! "$pr_created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Promotion PR creation time is not a canonical UTC timestamp."
            exit 1
          fi

          gh pr comment "$pr_number" \
            --repo "$REPO" \
            --body "@coderabbitai review"

          echo "pr_created_at=$pr_created_at" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_sha=$pr_sha" >> "$GITHUB_OUTPUT"
          echo "### Promotion PR: #$pr_number (head: \`${pr_sha:0:12}\`)" >> "$GITHUB_STEP_SUMMARY"

  staging-rest-pre:
    name: Staging Supabase REST pre-flight
    needs: open-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe staging Supabase REST API
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${STAGING_SUPABASE_URL:-}" || -z "${STAGING_SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::STAGING_SUPABASE_URL and STAGING_SUPABASE_ANON_KEY must be configured."
            exit 1
          fi

          http_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            -H "apikey: ${STAGING_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ANON_KEY}" \
            "${STAGING_SUPABASE_URL%/}/rest/v1/" || printf "000")

          if [[ "$http_code" =~ ^2 ]]; then
            echo "### Staging REST pre-flight: ✅ HTTP $http_code" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Staging REST pre-flight failed (HTTP $http_code); PR remains open."
            exit 1
          fi

  wait-for-gates:
    name: Wait for promotion PR gates
    needs: [open-pr, staging-rest-pre]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
      pull-requests: read
      statuses: read

    steps:
      - name: Poll exact-head CI, review status, and threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open-pr.outputs.pr_number }}
          PR_CREATED_AT: ${{ needs.open-pr.outputs.pr_created_at }}
          PR_SHA: ${{ needs.open-pr.outputs.pr_sha }}
        run: |
          set -euo pipefail

          deadline=$(( $(date +%s) + 2400 ))
          required_checks=(
            "Type, test, build, and package"
          )
          promotion_checks='[
            "Open or update dev→staging PR",
            "Staging Supabase REST pre-flight",
            "Wait for promotion PR gates",
            "Staging Supabase REST pre-merge re-check",
            "Squash-merge promotion PR"
          ]'

          while true; do
            if (( $(date +%s) > deadline )); then
              echo "::error::Promotion gates timed out after 40 minutes."
              exit 1
            fi

            current_sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json headRefOid --jq '.headRefOid')
            if [[ "$current_sha" != "$PR_SHA" ]]; then
              echo "::error::PR head changed from captured SHA $PR_SHA to $current_sha."
              exit 1
            fi

            checks=$(gh api "repos/$REPO/commits/$PR_SHA/check-runs?per_page=100" \
              --jq '.check_runs' \
              | jq --argjson promotion_checks "$promotion_checks" \
                --argjson pr_number "$PR_NUMBER" \
                '[.[] |
                  select(any(.pull_requests[]?; .number == $pr_number)) |
                  select(.name as $name | $promotion_checks | index($name) | not)]
                 | group_by(.name)
                 | map(sort_by(.started_at // .created_at) | last)')
            statuses=$(gh api "repos/$REPO/commits/$PR_SHA/status" --jq '.statuses' \
              | jq --arg pr_created_at "$PR_CREATED_AT" \
                '[.[] | select(.created_at >= $pr_created_at)]
                 | group_by(.context)
                 | map(sort_by(.created_at) | last)')
            threads=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved} pageInfo{hasNextPage}} reviews(first:100){nodes{author{login} commit{oid} submittedAt} pageInfo{hasNextPage}}}}}' \
              -f owner="${REPO%%/*}" \
              -f name="${REPO#*/}" \
              -F number="$PR_NUMBER")
            if [[ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$threads")" == "true" ]]; then
              echo "::error::Review thread count exceeds the validated 100-thread page."
              exit 1
            fi
            if [[ "$(jq -r '.data.repository.pullRequest.reviews.pageInfo.hasNextPage' <<<"$threads")" == "true" ]]; then
              echo "::error::Review count exceeds the validated 100-review page."
              exit 1
            fi
            unresolved=$(jq \
              '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' \
              <<<"$threads")
            coderabbit_reviews=$(jq \
              --arg pr_sha "$PR_SHA" \
              --arg pr_created_at "$PR_CREATED_AT" \
              '[.data.repository.pullRequest.reviews.nodes[] |
                select(.author.login == "coderabbitai") |
                select(.commit.oid == $pr_sha) |
                select(.submittedAt >= $pr_created_at)] | length' \
              <<<"$threads")

            failed_checks=$(jq -r \
              '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not)) | .name] | join(", ")' \
              <<<"$checks")
            failed_statuses=$(jq -r \
              '[.[] | select(.state | IN("failure","error")) | .context] | unique | join(", ")' \
              <<<"$statuses")
            if [[ -n "$failed_checks" || -n "$failed_statuses" ]]; then
              echo "::error::Failed gates — checks: ${failed_checks:-none}; statuses: ${failed_statuses:-none}."
              exit 1
            fi

            missing=()
            pending=()
            required_failed=()
            for required in "${required_checks[@]}"; do
              count=$(jq --arg required "$required" '[.[] | select(.name == $required)] | length' <<<"$checks")
              success=$(jq --arg required "$required" \
                '[.[] | select(.name == $required and .status == "completed" and .conclusion == "success")] | length' \
                <<<"$checks")
              if (( count == 0 )); then
                missing+=("$required")
              elif (( success == 0 )); then
                completed_non_success=$(jq --arg required "$required" \
                  '[.[] | select(.name == $required and .status == "completed" and .conclusion != "success")] | length' \
                  <<<"$checks")
                if (( completed_non_success > 0 )); then
                  required_failed+=("$required")
                else
                  pending+=("$required")
                fi
              fi
            done
            if (( ${#required_failed[@]} > 0 )); then
              echo "::error::Required checks did not succeed: ${required_failed[*]}."
              exit 1
            fi

            coderabbit=$(jq -r \
              '[.[] | select(.context == "CodeRabbit")] | last | .state // "missing"' \
              <<<"$statuses")
            coderabbit_description=$(jq -r \
              '[.[] | select(.context == "CodeRabbit")] | last | .description // ""' \
              <<<"$statuses")
            octopus=$(jq -r \
              '[.[] | select(.context == "Octopus PR Quality Gates")] | last | .state // "missing"' \
              <<<"$statuses")
            octopus_description=$(jq -r \
              '[.[] | select(.context == "Octopus PR Quality Gates")] | last | .description // ""' \
              <<<"$statuses")
            expected_octopus_description="Runbook completed for PR #$PR_NUMBER"
            other_pending=$(jq \
              '[.[] | select(.status != "completed")] | length' <<<"$checks")
            pending_statuses=$(jq \
              '[.[] | select(.state == "pending")] | length' <<<"$statuses")

            echo "Required missing=${#missing[@]} pending=${#pending[@]}; Octopus=$octopus ($octopus_description); CodeRabbit=$coderabbit ($coderabbit_description) exact reviews=$coderabbit_reviews; other pending checks=$other_pending statuses=$pending_statuses; unresolved threads=$unresolved"

            if (( ${#missing[@]} == 0 && ${#pending[@]} == 0 )) \
              && [[ "$octopus" == "success" ]] \
              && [[ "$octopus_description" == "$expected_octopus_description" ]] \
              && [[ "$coderabbit" == "success" ]] \
              && [[ "$coderabbit_description" == "Review completed" ]] \
              && (( coderabbit_reviews > 0 && other_pending == 0 && pending_statuses == 0 && unresolved == 0 )); then
              echo "### PR gates: ✅ exact-head CI, Octopus, CodeRabbit, and threads passed" >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            sleep 20
          done

  staging-rest-pre-merge:
    name: Staging Supabase REST pre-merge re-check
    needs: [open-pr, wait-for-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Re-probe staging Supabase REST API
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            -H "apikey: ${STAGING_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ANON_KEY}" \
            "${STAGING_SUPABASE_URL%/}/rest/v1/" || printf "000")

          if [[ "$http_code" =~ ^2 ]]; then
            echo "### Staging REST pre-merge: ✅ HTTP $http_code" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Staging REST pre-merge probe failed (HTTP $http_code); PR remains open."
            exit 1
          fi

  merge:
    name: Squash-merge promotion PR
    needs: [open-pr, wait-for-gates, staging-rest-pre-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Report dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run — PR #${{ needs.open-pr.outputs.pr_number }} remains open."
          echo "### Dry run: merge skipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Squash-merge exact promotion head
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open-pr.outputs.pr_number }}
          PR_SHA: ${{ needs.open-pr.outputs.pr_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GH_PAT_FOR_OCTOPUS is required so the staging push triggers its workflows."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --match-head-commit "$PR_SHA" \
            --subject "chore(release): promote dev → staging" \
            --body "Automated exact-head promotion from dev at ${PR_SHA:0:12}."

          state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq '.state')
          merge_sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid // ""')
          if [[ "$state" != "MERGED" || ! "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not confirm a completed merge."
            exit 1
          fi

          echo "### Merge: ✅ PR #$PR_NUMBER at \`${merge_sha:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "> **staging → main** remains a human-only gate." >> "$GITHUB_STEP_SUMMARY"
