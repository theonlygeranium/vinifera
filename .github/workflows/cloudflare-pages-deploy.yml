# ============================================================
# EDSTRATUM LABS — CLOUDFLARE PAGES AUTO-DEPLOY
# ============================================================
# Triggers a Cloudflare Pages production deployment on every
# push to main via the Cloudflare API, bypassing the need for
# the CF Pages GitHub webhook (which requires the dashboard
# OAuth handshake to register).
#
# REQUIRED SECRETS:
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token with Pages access
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID
# ============================================================

name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Cloudflare Pages deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Pages deployment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "→ Triggering Cloudflare Pages deployment for vinifera..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/vinifera/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Deployment trigger failed"
            echo "$BODY"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
          echo "✓ Deployment triggered: $DEPLOY_ID"
          echo "deployment_id=$DEPLOY_ID" >> $GITHUB_ENV

      - name: Poll deployment status
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          DEPLOY_ID="${{ env.deployment_id }}"
          echo "→ Polling deployment $DEPLOY_ID..."
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(curl -s \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/vinifera/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r['latest_stage']['name']+':'+r['latest_stage']['status'])")
            echo "  [$i] $STATUS"
            if echo "$STATUS" | grep -q ":success"; then
              echo "✓ Deployment succeeded"
              exit 0
            fi
            if echo "$STATUS" | grep -q ":failure"; then
              echo "✗ Deployment failed"
              exit 1
            fi
          done
          echo "✗ Deployment timed out after 5 minutes"
          exit 1
