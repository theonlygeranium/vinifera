name: Credential envelope key rotation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start, resume, or verify a durable credential-envelope rotation
        required: true
        type: choice
        options:
          - start
          - resume
          - verify
      git_sha:
        description: Exact 40-character commit currently at canonical main
        required: true
        type: string
      source_key_version:
        description: Existing key version that remains in the server-only keyring
        required: true
        type: string
      target_key_version:
        description: New key version already configured as the active key
        required: true
        type: string
      run_id:
        description: Durable rotation UUID for resume or verify; blank for start
        required: false
        type: string
      batch_size:
        description: Envelopes per transaction claim, bounded by checked-in policy
        required: false
        default: "100"
        type: string
      maximum_batches:
        description: Bounded batches to process in this invocation
        required: false
        default: "100"
        type: string
      confirmation:
        description: Exact operation confirmation from the checked-in policy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vinifera-credential-envelope-rotation
  cancel-in-progress: false

jobs:
  rotate:
    name: ${{ inputs.operation }} credential-envelope rotation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      CREDENTIAL_ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
      CREDENTIAL_ROTATION_GIT_SHA: ${{ inputs.git_sha }}
      INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION: ${{ secrets.PRODUCTION_INTEGRATION_CREDENTIAL_ACTIVE_KEY_VERSION }}
      INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS: ${{ secrets.PRODUCTION_INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS }}
      ROTATION_BATCH_SIZE: ${{ inputs.batch_size }}
      ROTATION_MAXIMUM_BATCHES: ${{ inputs.maximum_batches }}
      ROTATION_OPERATION: ${{ inputs.operation }}
      ROTATION_RUN_ID: ${{ inputs.run_id }}
      ROTATION_SOURCE_KEY_VERSION: ${{ inputs.source_key_version }}
      ROTATION_TARGET_KEY_VERSION: ${{ inputs.target_key_version }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}

    steps:
      - name: Validate canonical immutable source target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "theonlygeranium/vinifera" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CREDENTIAL_ROTATION_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$ROTATION_OPERATION" == "start" ]]; then
            [[ -z "$ROTATION_RUN_ID" ]]
          else
            [[ "$ROTATION_RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          fi

      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.git_sha }}

      - name: Verify commit is the immutable head of canonical main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CREDENTIAL_ROTATION_GIT_SHA" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$CREDENTIAL_ROTATION_GIT_SHA" ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
          node-version: 22.22.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify credential rotation control tests
        run: npx vitest run tests/scripts/credential-envelope-rotation.test.mjs

      - name: Initialize sanitized evidence path
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/credential-envelope-rotation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence_dir"
          {
            echo "ROTATION_EVIDENCE_DIR=$evidence_dir"
            echo "ROTATION_REPORT=$evidence_dir/report.json"
          } >> "$GITHUB_ENV"

      - name: Run bounded server-only credential rewrap
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            execute "$ROTATION_OPERATION"
            --source "$ROTATION_SOURCE_KEY_VERSION"
            --target "$ROTATION_TARGET_KEY_VERSION"
            --report "$ROTATION_REPORT"
            --batch-size "$ROTATION_BATCH_SIZE"
            --max-batches "$ROTATION_MAXIMUM_BATCHES"
          )
          if [[ -n "$ROTATION_RUN_ID" ]]; then
            arguments+=(--run-id "$ROTATION_RUN_ID")
          fi
          node scripts/credential-envelope-rotation.mjs "${arguments[@]}"

      - name: Upload sanitized rotation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: credential-envelope-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROTATION_EVIDENCE_DIR }}
          retention-days: 90
