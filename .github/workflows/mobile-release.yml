name: Signed mobile internal release

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full 40-character commit SHA from canonical origin/main
        type: string
        required: true
      release_action:
        description: Build signed artifacts or upload them to internal tracks
        type: choice
        required: true
        default: build-only
        options:
          - build-only
          - upload-internal
      build_confirmation:
        description: Type BUILD SIGNED VINIFERA MOBILE RELEASE
        type: string
        required: true
      upload_confirmation:
        description: For upload-internal only, type UPLOAD VINIFERA MOBILE INTERNAL TRACKS
        type: string
        required: false
        default: ""

permissions:
  contents: read
  deployments: none

concurrency:
  group: vinifera-mobile-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm protected mobile release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: mobile-release
      deployment: false
    steps:
      - name: Validate canonical repository and target format
        env:
          RELEASE_GIT_SHA: ${{ inputs.git_sha }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "theonlygeranium/vinifera" ]]
          [[ "$RELEASE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.git_sha }}

      - name: Verify immutable canonical release target
        env:
          RELEASE_GIT_SHA: ${{ inputs.git_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$RELEASE_GIT_SHA" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_GIT_SHA" origin/main

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0

      - name: Validate exact human confirmations
        env:
          MOBILE_BUILD_CONFIRMATION: ${{ inputs.build_confirmation }}
          MOBILE_RELEASE_GIT_SHA: ${{ inputs.git_sha }}
          MOBILE_RELEASE_ACTION: ${{ inputs.release_action }}
          MOBILE_UPLOAD_CONFIRMATION: ${{ inputs.upload_confirmation }}
        run: node scripts/mobile-release.mjs validate-request

  android:
    name: Signed Android App Bundle
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: mobile-release
      deployment: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.git_sha }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Use Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Android release secrets and production origin
        env:
          GOOGLE_PLAY_RELEASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_RELEASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          MOBILE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          MOBILE_ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          MOBILE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
          MOBILE_ANDROID_PACKAGE_NAME: ${{ secrets.MOBILE_ANDROID_PACKAGE_NAME }}
          MOBILE_ANDROID_SIGNING_CERT_SHA256: ${{ secrets.MOBILE_ANDROID_SIGNING_CERT_SHA256 }}
          MOBILE_BUILD_CONFIRMATION: ${{ inputs.build_confirmation }}
          MOBILE_BUILD_PROFILE: production-precutover
          MOBILE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON_BASE64 }}
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "true"
          MOBILE_RELEASE_GIT_SHA: ${{ inputs.git_sha }}
          MOBILE_RELEASE_ACTION: ${{ inputs.release_action }}
          MOBILE_UPLOAD_CONFIRMATION: ${{ inputs.upload_confirmation }}
          VITE_MOBILE_API_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
        run: node scripts/mobile-release.mjs validate-environment --platform android

      - name: Verify exact pre-cutover Android Worker and association routes
        env:
          MOBILE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          MOBILE_ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          MOBILE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
          MOBILE_ANDROID_PACKAGE_NAME: ${{ secrets.MOBILE_ANDROID_PACKAGE_NAME }}
          MOBILE_ANDROID_SIGNING_CERT_SHA256: ${{ secrets.MOBILE_ANDROID_SIGNING_CERT_SHA256 }}
          MOBILE_BUILD_CONFIRMATION: ${{ inputs.build_confirmation }}
          MOBILE_BUILD_PROFILE: production-precutover
          MOBILE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON_BASE64 }}
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "true"
          MOBILE_RELEASE_ACTION: ${{ inputs.release_action }}
          MOBILE_RELEASE_GIT_SHA: ${{ inputs.git_sha }}
          MOBILE_UPLOAD_CONFIRMATION: ${{ inputs.upload_confirmation }}
          GOOGLE_PLAY_RELEASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_RELEASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          VITE_MOBILE_API_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
        run: node scripts/mobile-release.mjs verify-precutover-origin --platform android --output "$RUNNER_TEMP/android-precutover-origin.json"

      - name: Build pre-cutover production Worker native web bundle
        env:
          MOBILE_BUILD_PROFILE: production-precutover
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "true"
          VITE_MOBILE_API_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
        run: |
          npm run build:mobile:web
          npx cap sync android

      - name: Materialize ephemeral Android signing inputs
        id: android-signing
        env:
          MOBILE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          release_dir="$RUNNER_TEMP/vinifera-mobile-android-release"
          install -d -m 700 "$release_dir"
          test ! -e android/app/google-services.json
          node scripts/mobile-release.mjs write-secret-file \
            --kind android-keystore \
            --output "$release_dir/upload.keystore"
          node scripts/mobile-release.mjs write-google-services \
            --output android/app/google-services.json
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Build signed Android App Bundle
        id: android-build
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/vinifera-mobile-android-release/upload.keystore
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
          MOBILE_ANDROID_SIGNING_CERT_SHA256: ${{ secrets.MOBILE_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          keystore="$RUNNER_TEMP/vinifera-mobile-android-release/upload.keystore"
          actual_signing_fingerprint="$(
            keytool -list -v \
              -keystore "$keystore" \
              -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_RELEASE_KEY_ALIAS" 2>/dev/null |
              awk -F': ' '/SHA256:/{print $2; exit}'
          )"
          [[ "$actual_signing_fingerprint" =~ ^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$ ]]
          [[ "${actual_signing_fingerprint^^}" == "${MOBILE_ANDROID_SIGNING_CERT_SHA256^^}" ]]
          ./android/gradlew -p android bundleRelease --stacktrace

      - name: Verify Android App Bundle signature
        id: android-verification
        run: |
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          jarsigner -verify -strict "$aab" \
            > "$RUNNER_TEMP/vinifera-mobile-android-release/jarsigner.log" 2>&1

      - name: Upload Android App Bundle to Google Play internal
        id: google-play-upload
        if: inputs.release_action == 'upload-internal'
        env:
          GOOGLE_PLAY_RELEASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_RELEASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          node scripts/mobile-release.mjs upload-google-play \
            --aab android/app/build/outputs/bundle/release/app-release.aab

      - name: Retain signed Android release artifact
        if: steps.android-verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-android-internal-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Write sanitized Android build evidence
        if: always()
        run: |
          node scripts/mobile-release.mjs write-evidence \
            --platform android \
            --action "${{ inputs.release_action }}" \
            --git-sha "${{ inputs.git_sha }}" \
            --build "${{ steps.android-build.outcome }}" \
            --verification "${{ steps.android-verification.outcome }}" \
            --upload "${{ steps.google-play-upload.outcome }}" \
            --output "$RUNNER_TEMP/android-mobile-release-evidence.json"

      - name: Upload sanitized Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-mobile-release-evidence
          path: |
            ${{ runner.temp }}/android-mobile-release-evidence.json
            ${{ runner.temp }}/android-precutover-origin.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove Android signing material
        if: always()
        run: |
          rm -f -- android/app/google-services.json
          rm -rf -- "$RUNNER_TEMP/vinifera-mobile-android-release"

  ios:
    name: Signed iOS TestFlight build
    needs: authorize
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: mobile-release
      deployment: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.git_sha }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate iOS release secrets and production origin
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MOBILE_APPLE_TEAM_ID: ${{ secrets.MOBILE_APPLE_TEAM_ID }}
          MOBILE_BUILD_CONFIRMATION: ${{ inputs.build_confirmation }}
          MOBILE_BUILD_PROFILE: production-precutover
          MOBILE_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.MOBILE_IOS_APP_STORE_PROFILE_BASE64 }}
          MOBILE_IOS_BUNDLE_ID: ${{ secrets.MOBILE_IOS_BUNDLE_ID }}
          MOBILE_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MOBILE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          MOBILE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MOBILE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "true"
          MOBILE_RELEASE_GIT_SHA: ${{ inputs.git_sha }}
          MOBILE_RELEASE_ACTION: ${{ inputs.release_action }}
          MOBILE_UPLOAD_CONFIRMATION: ${{ inputs.upload_confirmation }}
          VITE_MOBILE_API_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
        run: node scripts/mobile-release.mjs validate-environment --platform ios

      - name: Verify exact pre-cutover iOS Worker and association routes
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MOBILE_APPLE_TEAM_ID: ${{ secrets.MOBILE_APPLE_TEAM_ID }}
          MOBILE_BUILD_CONFIRMATION: ${{ inputs.build_confirmation }}
          MOBILE_BUILD_PROFILE: production-precutover
          MOBILE_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.MOBILE_IOS_APP_STORE_PROFILE_BASE64 }}
          MOBILE_IOS_BUNDLE_ID: ${{ secrets.MOBILE_IOS_BUNDLE_ID }}
          MOBILE_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MOBILE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          MOBILE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MOBILE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "true"
          MOBILE_RELEASE_ACTION: ${{ inputs.release_action }}
          MOBILE_RELEASE_GIT_SHA: ${{ inputs.git_sha }}
          MOBILE_UPLOAD_CONFIRMATION: ${{ inputs.upload_confirmation }}
          VITE_MOBILE_API_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
        run: node scripts/mobile-release.mjs verify-precutover-origin --platform ios --output "$RUNNER_TEMP/ios-precutover-origin.json"

      - name: Build pre-cutover production Worker native web bundle
        env:
          MOBILE_BUILD_PROFILE: production-precutover
          MOBILE_PRODUCTION_ORIGIN_AUTHORIZED: "true"
          VITE_MOBILE_API_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
        run: |
          npm run build:mobile:web
          npx cap sync ios

      - name: Install ephemeral Apple signing material
        id: ios-signing
        env:
          MOBILE_APPLE_TEAM_ID: ${{ secrets.MOBILE_APPLE_TEAM_ID }}
          MOBILE_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.MOBILE_IOS_APP_STORE_PROFILE_BASE64 }}
          MOBILE_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MOBILE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          MOBILE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MOBILE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          release_dir="$RUNNER_TEMP/vinifera-mobile-ios-release"
          install -d -m 700 "$release_dir"
          certificate_path="$release_dir/distribution.p12"
          profile_path="$release_dir/app-store.mobileprovision"
          profile_plist="$release_dir/profile.plist"
          keychain_path="$release_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          node scripts/mobile-release.mjs write-secret-file \
            --kind ios-certificate \
            --output "$certificate_path"
          node scripts/mobile-release.mjs write-secret-file \
            --kind ios-profile \
            --output "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MOBILE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            > /dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" \
            > /dev/null

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$profile_plist")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist" 2>/dev/null || true)"

          [[ "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]
          [[ "$profile_team" == "$MOBILE_APPLE_TEAM_ID" ]]
          [[ "$profile_app_id" == "$MOBILE_APPLE_TEAM_ID.ai.edstratumlabs.vinifera" ]]
          [[ "$get_task_allow" != "true" ]]
          PROFILE_EXPIRATION="$profile_expiration" node --input-type=module -e '
            const expiry = Date.parse(process.env.PROFILE_EXPIRATION ?? "");
            if (!Number.isFinite(expiry) || expiry <= Date.now()) process.exit(1);
          '

          installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          install -d -m 700 "$(dirname "$installed_profile")"
          install -m 600 "$profile_path" "$installed_profile"

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_path=$installed_profile" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Archive and export signed iOS IPA
        id: ios-build
        env:
          MOBILE_APPLE_TEAM_ID: ${{ secrets.MOBILE_APPLE_TEAM_ID }}
          MOBILE_IOS_BUNDLE_ID: ${{ secrets.MOBILE_IOS_BUNDLE_ID }}
          MOBILE_IOS_PROFILE_UUID: ${{ steps.ios-signing.outputs.profile_uuid }}
        run: |
          release_dir="$RUNNER_TEMP/vinifera-mobile-ios-release"
          archive_path="$release_dir/Vinifera.xcarchive"
          export_path="$release_dir/export"
          export_options="$release_dir/ExportOptions.plist"
          keychain_path="${{ steps.ios-signing.outputs.keychain_path }}"

          node scripts/mobile-release.mjs write-ios-export-options \
            --output "$export_options"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -derivedDataPath "$release_dir/DerivedData" \
            -hideShellScriptEnvironment \
            clean archive \
            CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$MOBILE_APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $keychain_path" \
            PRODUCT_BUNDLE_IDENTIFIER="$MOBILE_IOS_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$MOBILE_IOS_PROFILE_UUID"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -hideShellScriptEnvironment \
            OTHER_CODE_SIGN_FLAGS="--keychain $keychain_path"

      - name: Verify signed iOS IPA with xcrun
        id: ios-verification
        env:
          MOBILE_APPLE_TEAM_ID: ${{ secrets.MOBILE_APPLE_TEAM_ID }}
          MOBILE_IOS_BUNDLE_ID: ${{ secrets.MOBILE_IOS_BUNDLE_ID }}
        run: |
          release_dir="$RUNNER_TEMP/vinifera-mobile-ios-release"
          export_path="$release_dir/export"
          ipa_count="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          [[ "$ipa_count" == "1" ]]
          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          verify_path="$release_dir/verify"
          install -d -m 700 "$verify_path"
          ditto -x -k "$ipa_path" "$verify_path"
          app_count="$(find "$verify_path/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          [[ "$app_count" == "1" ]]
          app_path="$(find "$verify_path/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"

          xcrun codesign --verify --deep --strict --verbose=0 "$app_path"
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          [[ "$actual_bundle_id" == "$MOBILE_IOS_BUNDLE_ID" ]]
          xcrun codesign -d --entitlements :- "$app_path" \
            > "$release_dir/signed-entitlements.plist" 2>/dev/null
          signed_app_id="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$release_dir/signed-entitlements.plist")"
          [[ "$signed_app_id" == "$MOBILE_APPLE_TEAM_ID.$MOBILE_IOS_BUNDLE_ID" ]]
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Validate and upload to App Store Connect for internal TestFlight
        id: testflight-upload
        if: inputs.release_action == 'upload-internal'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          release_dir="$RUNNER_TEMP/vinifera-mobile-ios-release"
          asc_home="$release_dir/app-store-connect-home"
          key_dir="$asc_home/.appstoreconnect/private_keys"
          install -d -m 700 "$key_dir"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          node scripts/mobile-release.mjs write-secret-file \
            --kind app-store-key \
            --output "$key_path"

          if ! HOME="$asc_home" API_PRIVATE_KEYS_DIR="$key_dir" \
            xcrun altool --validate-app \
              -f "${{ steps.ios-verification.outputs.ipa_path }}" \
              -t ios \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              > "$release_dir/app-store-validation.log" 2>&1; then
            echo "::error::App Store Connect validation failed."
            exit 1
          fi
          if ! HOME="$asc_home" API_PRIVATE_KEYS_DIR="$key_dir" \
            xcrun altool --upload-app \
              -f "${{ steps.ios-verification.outputs.ipa_path }}" \
              -t ios \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              > "$release_dir/app-store-upload.log" 2>&1; then
            echo "::error::App Store Connect upload failed."
            exit 1
          fi

      - name: Retain signed iOS release artifact
        if: steps.ios-verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-ios-testflight-release
          path: ${{ steps.ios-verification.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Write sanitized iOS build evidence
        if: always()
        run: |
          node scripts/mobile-release.mjs write-evidence \
            --platform ios \
            --action "${{ inputs.release_action }}" \
            --git-sha "${{ inputs.git_sha }}" \
            --build "${{ steps.ios-build.outcome }}" \
            --verification "${{ steps.ios-verification.outcome }}" \
            --upload "${{ steps.testflight-upload.outcome }}" \
            --output "$RUNNER_TEMP/ios-mobile-release-evidence.json"

      - name: Upload sanitized iOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-mobile-release-evidence
          path: |
            ${{ runner.temp }}/ios-mobile-release-evidence.json
            ${{ runner.temp }}/ios-precutover-origin.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove Apple signing and API key material
        if: always()
        run: |
          keychain_path="${{ steps.ios-signing.outputs.keychain_path }}"
          profile_path="${{ steps.ios-signing.outputs.profile_path }}"
          if [[ -n "$keychain_path" && -e "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          case "$profile_path" in
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision)
              rm -f -- "$profile_path"
              ;;
          esac
          rm -rf -- "$RUNNER_TEMP/vinifera-mobile-ios-release"
