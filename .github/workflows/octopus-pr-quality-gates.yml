name: Octopus PR Quality Gates

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality-gates:
    name: Run PR Quality Gates
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Run PR Quality Gates Runbook in Octopus 🐙
        id: quality-gates-run
        uses: OctopusDeploy/run-runbook-action@v4
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: Default
        with:
          project: Vinifera
          runbook: PR Quality Gates
          environments: Development
          variables: |
            PRBranch: ${{ github.head_ref }}
            PRNumber: ${{ github.event.pull_request.number }}
            GitHubPAT: ${{ secrets.GH_PAT_FOR_OCTOPUS }}

      - name: Await PR Quality Gates Runbook
        uses: OctopusDeploy/await-task-action@v4
        with:
          server_task_id: ${{ fromJson(steps.quality-gates-run.outputs.server_tasks)[0].serverTaskId }}

  # Runs only when quality-gates fails — posts AI analysis + auto-fix diff as PR comments
  comment-and-fix:
    name: Post AI Analysis and Auto-Fix Suggestions
    runs-on: ubuntu-latest
    needs: quality-gates
    if: failure()

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Run PR Comment Bot Runbook 🤖
        id: comment-bot-run
        uses: OctopusDeploy/run-runbook-action@v4
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: Default
        with:
          project: Vinifera
          runbook: PR Comment Bot
          environments: Development
          variables: |
            PRBranch: ${{ github.head_ref }}
            PRNumber: ${{ github.event.pull_request.number }}
            GitHubPAT: ${{ secrets.GH_PAT_FOR_OCTOPUS }}

      - name: Await PR Comment Bot Runbook
        uses: OctopusDeploy/await-task-action@v4
        with:
          server_task_id: ${{ fromJson(steps.comment-bot-run.outputs.server_tasks)[0].serverTaskId }}

      - name: Run Auto-Fix Suggestions Runbook 🔧
        id: auto-fix-run
        uses: OctopusDeploy/run-runbook-action@v4
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: Default
        with:
          project: Vinifera
          runbook: Auto-Fix Suggestions
          environments: Development
          variables: |
            PRBranch: ${{ github.head_ref }}
            PRNumber: ${{ github.event.pull_request.number }}
            GitHubPAT: ${{ secrets.GH_PAT_FOR_OCTOPUS }}

      - name: Await Auto-Fix Suggestions Runbook
        uses: OctopusDeploy/await-task-action@v4
        with:
          server_task_id: ${{ fromJson(steps.auto-fix-run.outputs.server_tasks)[0].serverTaskId }}
