name: Octopus PR Quality Gates

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality-gates:
    name: Run PR Quality Gates
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Install Octopus CLI 🐙
        uses: OctopusDeploy/install-octopus-cli-action@aee5b620e9107e6ef3ae0cbd25dfde10e0910168
        with:
          version: latest

      - name: Run PR Quality Gates Runbook in Octopus 🐙
        env:
          GH_PAT_FOR_OCTOPUS: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          octo run-runbook \
            --apiKey="$OCTOPUS_API_KEY" \
            --cancelOnTimeout \
            --environment="Development" \
            --logLevel="information" \
            --noRawLog \
            --progress \
            --project="Vinifera" \
            --runbook="PR Quality Gates" \
            --runTimeout="00:15:00" \
            --server="$OCTOPUS_URL" \
            --space="Default" \
            --variable="PRBranch:$PR_BRANCH" \
            --variable="PRNumber:$PR_NUMBER" \
            --variable="GitHubPAT:$GH_PAT_FOR_OCTOPUS" \
            --waitForRun

  # Runs only when quality-gates fails — posts AI analysis + auto-fix diff as PR comments
  comment-and-fix:
    name: Post AI Analysis and Auto-Fix Suggestions
    runs-on: ubuntu-latest
    needs: quality-gates
    if: failure()

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Install Octopus CLI 🐙
        uses: OctopusDeploy/install-octopus-cli-action@aee5b620e9107e6ef3ae0cbd25dfde10e0910168
        with:
          version: latest

      - name: Run PR Comment Bot Runbook 🤖
        env:
          GH_PAT_FOR_OCTOPUS: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          octo run-runbook \
            --apiKey="$OCTOPUS_API_KEY" \
            --cancelOnTimeout \
            --environment="Development" \
            --logLevel="information" \
            --noRawLog \
            --progress \
            --project="Vinifera" \
            --runbook="PR Comment Bot" \
            --runTimeout="00:15:00" \
            --server="$OCTOPUS_URL" \
            --space="Default" \
            --variable="PRBranch:$PR_BRANCH" \
            --variable="PRNumber:$PR_NUMBER" \
            --variable="GitHubPAT:$GH_PAT_FOR_OCTOPUS" \
            --waitForRun

      - name: Run Auto-Fix Suggestions Runbook 🔧
        env:
          GH_PAT_FOR_OCTOPUS: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          octo run-runbook \
            --apiKey="$OCTOPUS_API_KEY" \
            --cancelOnTimeout \
            --environment="Development" \
            --logLevel="information" \
            --noRawLog \
            --progress \
            --project="Vinifera" \
            --runbook="Auto-Fix Suggestions" \
            --runTimeout="00:15:00" \
            --server="$OCTOPUS_URL" \
            --space="Default" \
            --variable="PRBranch:$PR_BRANCH" \
            --variable="PRNumber:$PR_NUMBER" \
            --variable="GitHubPAT:$GH_PAT_FOR_OCTOPUS" \
            --waitForRun
