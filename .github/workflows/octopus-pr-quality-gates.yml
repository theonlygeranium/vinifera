name: Octopus PR Quality Gates

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality-gates:
    name: Run PR Quality Gates
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run PR Quality Gates Runbook in Octopus 🐙
        env:
          GH_PAT_FOR_OCTOPUS: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/octopus-runbook.mjs "PR Quality Gates"

  # Runs only when quality-gates fails — posts AI analysis + auto-fix diff as PR comments
  comment-and-fix:
    name: Post AI Analysis and Auto-Fix Suggestions
    runs-on: ubuntu-latest
    needs: quality-gates
    if: failure()

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run PR Comment Bot Runbook 🤖
        env:
          GH_PAT_FOR_OCTOPUS: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/octopus-runbook.mjs "PR Comment Bot"

      - name: Run Auto-Fix Suggestions Runbook 🔧
        env:
          GH_PAT_FOR_OCTOPUS: ${{ secrets.GH_PAT_FOR_OCTOPUS }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/octopus-runbook.mjs "Auto-Fix Suggestions"
