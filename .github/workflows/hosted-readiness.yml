name: Hosted readiness probe

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: none

concurrency:
  group: vinifera-hosted-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Read-only hosted readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0

      - name: Probe hosted readiness without mutations
        env:
          GENERIC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GENERIC_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GENERIC_STRIPE_PRICE_CELLAR: ${{ secrets.STRIPE_PRICE_CELLAR }}
          GENERIC_STRIPE_PRICE_ESTATE: ${{ secrets.STRIPE_PRICE_ESTATE }}
          GENERIC_STRIPE_PRICE_RESERVE: ${{ secrets.STRIPE_PRICE_RESERVE }}
          GENERIC_STRIPE_PRICE_VINE: ${{ secrets.STRIPE_PRICE_VINE }}
          GENERIC_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GENERIC_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GENERIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GENERIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GENERIC_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GENERIC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENERIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STAGING_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_STRIPE_PRICE_CELLAR: ${{ secrets.STAGING_STRIPE_PRICE_CELLAR }}
          STAGING_STRIPE_PRICE_ESTATE: ${{ secrets.STAGING_STRIPE_PRICE_ESTATE }}
          STAGING_STRIPE_PRICE_RESERVE: ${{ secrets.STAGING_STRIPE_PRICE_RESERVE }}
          STAGING_STRIPE_PRICE_VINE: ${{ secrets.STAGING_STRIPE_PRICE_VINE }}
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          umask 077
          node scripts/hosted-readiness.mjs \
            --json "$RUNNER_TEMP/hosted-readiness-report.json" \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-readiness-report
          path: ${{ runner.temp }}/hosted-readiness-report.json
          if-no-files-found: error
          retention-days: 14
