name: Direct Push Guard

# The pull_request run supplies the required branch-protection context.
# The push run audits the resulting main commit against GitHub's associated-PR
# evidence. Actual pre-push prevention still comes from branch protection.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  check-direct-push:
    name: Block direct push to main
    if: ${{ !contains(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out guard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0

      - name: Validate guard policy
        if: github.event_name == 'pull_request'
        run: node --test .github/scripts/direct-push-guard.policy.mjs

      - name: Verify main was updated by a merged pull request
        if: github.event_name == 'push'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_FORCED: ${{ github.event.forced }}
          TARGET_BRANCH: main
        run: node .github/scripts/direct-push-guard.mjs
