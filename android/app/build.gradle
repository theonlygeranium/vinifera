apply plugin: 'com.android.application'

def releaseSigningNames = [
    'ANDROID_RELEASE_KEYSTORE_PATH',
    'ANDROID_RELEASE_KEYSTORE_PASSWORD',
    'ANDROID_RELEASE_KEY_ALIAS',
    'ANDROID_RELEASE_KEY_PASSWORD'
]
def releaseSigningValues = releaseSigningNames.collectEntries {
    [(it): System.getenv(it)]
}
def releaseSigningConfigured = releaseSigningNames.every {
    releaseSigningValues[it] != null && !releaseSigningValues[it].trim().isEmpty()
}
def releaseSigningPartiallyConfigured = releaseSigningNames.any {
    releaseSigningValues[it] != null && !releaseSigningValues[it].trim().isEmpty()
} && !releaseSigningConfigured

android {
    namespace = "ai.edstratumlabs.vinifera"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "ai.edstratumlabs.vinifera"
        minSdkVersion = rootProject.ext.minSdkVersion
        targetSdkVersion = rootProject.ext.targetSdkVersion
        versionCode = 5
        versionName = "0.5.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseSigningValues.ANDROID_RELEASE_KEYSTORE_PATH)
                storePassword = releaseSigningValues.ANDROID_RELEASE_KEYSTORE_PASSWORD
                keyAlias = releaseSigningValues.ANDROID_RELEASE_KEY_ALIAS
                keyPassword = releaseSigningValues.ANDROID_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def requestsReleaseBundle = taskGraph.allTasks.any {
        it.name == 'bundleRelease'
    }
    if (requestsReleaseBundle && releaseSigningPartiallyConfigured) {
        throw new GradleException(
            'Android release bundle signing credentials are incomplete.'
        )
    }
    if (requestsReleaseBundle && !releaseSigningConfigured) {
        throw new GradleException(
            'Android release bundles require ephemeral environment-backed signing.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // ionbarcode-android exposes Gson annotations from its AAR without
    // declaring Gson transitively. Keep the annotation classes available to R8.
    implementation "com.google.code.gson:gson:2.10.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
