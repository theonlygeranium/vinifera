# Local Supabase configuration for the Phase 1 foundation.
# Hosted credentials and OAuth provider secrets are configured outside Git.
project_id = "vinifera"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8788"
additional_redirect_urls = [
  "http://localhost:5173/api/auth/staff/callback",
  "http://localhost:5173/api/auth/member/callback",
  "http://127.0.0.1:5173/api/auth/staff/callback",
  "http://127.0.0.1:5173/api/auth/member/callback",
  "http://localhost:8788/api/auth/staff/callback",
  "http://localhost:8788/api/auth/member/callback",
  "http://127.0.0.1:8788/api/auth/staff/callback",
  "http://127.0.0.1:8788/api/auth/member/callback",
  "https://vinifera.edstratumlabs.ai/api/auth/staff/callback",
  "https://vinifera.edstratumlabs.ai/api/auth/member/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# The database RPC adds the product-specific rolling 5/email/hour gate.
email_sent = 5
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 0

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
# Member magic links are required to expire after 15 minutes.
otp_expiry = 900

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
port = 54327
